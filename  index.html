<!DOCTYPE html>
<html lang="ar-AE" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سنع الإمارات — من المجلس لين المنصات</title>
<meta name="description" content="سنع الإمارات: السلام والمخاشمة، الردود، إكرام الضيف بالتمر والقهوة، واللبس الإماراتي — بعشر لغات.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400&family=Noto+Sans+SC:wght@400;600;700&family=Noto+Sans+JP:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ard:#F7F1E6; --ard2:#EEE3CE; --ard3:#D8C7A6;
  --hail:#1E3A2F; --gahwa:#B0742C; --nuhas:#A98A4B; --warid:#8C2F2A;
  --disp:"Amiri","Times New Roman",serif;
  --body:"IBM Plex Sans Arabic","IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --pad:clamp(1.1rem,5vw,4.5rem);
}
html[dir="ltr"]{--disp:"IBM Plex Sans","Segoe UI",sans-serif;}
html[lang="zh"]{--disp:"Noto Sans SC",sans-serif;--body:"Noto Sans SC",sans-serif;}
html[lang="ja"]{--disp:"Noto Sans JP",sans-serif;--body:"Noto Sans JP",sans-serif;}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--ard);color:var(--hail);font-family:var(--body);font-size:17px;line-height:1.8;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--disp);font-weight:700;line-height:1.4;margin:0}
html[dir="ltr"] h1,html[dir="ltr"] h2,html[dir="ltr"] h3,html[dir="ltr"] h4{font-weight:600;letter-spacing:-.01em}
p{margin:0 0 1em}
:focus-visible{outline:2.5px solid var(--gahwa);outline-offset:3px}
.wrap{max-width:1040px;margin-inline:auto;padding-inline:var(--pad)}

.top{position:sticky;top:0;z-index:50;background:#F7F1E6F2;backdrop-filter:blur(8px);border-bottom:1px solid var(--ard3)}
.top .wrap{display:flex;align-items:center;gap:.7rem;min-height:58px;flex-wrap:wrap;padding-block:.3rem}
.brand{font-family:var(--disp);font-size:1.3rem;font-weight:700;white-space:nowrap}
.brand span{color:var(--gahwa)}
nav{display:flex;gap:.05rem;flex-wrap:wrap}
nav button{font-family:var(--body);font-size:.87rem;font-weight:500;color:inherit;background:none;border:0;cursor:pointer;padding:.4rem .5rem .5rem;position:relative;border-radius:4px}
nav button::after{content:"";position:absolute;inset-inline:.35rem;bottom:.25rem;height:2px;background:var(--gahwa);opacity:0;transition:.18s}
nav button:hover{background:#1e3a2f0d}
nav button[aria-current]::after{opacity:1}

.langwrap{position:relative;margin-inline-start:auto}
.langbtn{display:inline-flex;align-items:center;gap:.4rem;font-family:var(--body);font-size:.85rem;font-weight:500;
  background:none;border:1px solid var(--ard3);border-radius:4px;padding:.4rem .7rem;cursor:pointer;color:inherit}
.langbtn:hover{border-color:var(--hail)}
.langbtn svg{width:14px;height:14px}
.langmenu{position:absolute;inset-inline-end:0;top:calc(100% + 6px);background:#FCF8F0;border:1.5px solid var(--hail);
  border-radius:6px;min-width:200px;padding:.3rem;display:none;z-index:60;box-shadow:0 8px 24px #1e3a2f26;max-height:70vh;overflow:auto}
.langmenu.on{display:block}
.langmenu button{display:flex;width:100%;align-items:center;gap:.6rem;text-align:start;background:none;border:0;
  font-family:var(--body);font-size:.9rem;color:inherit;padding:.5rem .6rem;cursor:pointer;border-radius:4px}
.langmenu button:hover{background:var(--ard2)}
.langmenu button[aria-current="true"]{background:var(--hail);color:var(--ard)}
.langmenu .flag{font-size:1.1rem;line-height:1}
.langmenu .sub{font-size:.72rem;opacity:.6;margin-inline-start:auto}

.page{display:none;padding-block:clamp(2.2rem,6vw,4.2rem) clamp(3rem,8vw,6rem)}
.page.on{display:block;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.eyebrow{font-family:var(--mono);font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gahwa);display:block;margin-bottom:.85rem}
.lede{font-size:clamp(1rem,2.1vw,1.18rem);color:#1E3A2FD9;max-width:60ch}
.sechead{margin-bottom:clamp(1.7rem,4vw,2.5rem);max-width:64ch}
.sechead h2{font-size:clamp(1.75rem,4.4vw,2.6rem);margin-bottom:.55rem}

.hero h1{font-size:clamp(2.1rem,6.4vw,3.8rem);margin-bottom:1rem;max-width:18ch}
.hero h1 em{font-style:normal;color:var(--gahwa)}
.demo{margin:clamp(2rem,5vw,3rem) 0;max-width:640px}
.turn{display:flex;gap:.9rem;align-items:flex-start;margin-bottom:.8rem;opacity:0;animation:pop .5s ease forwards}
.turn:nth-child(2){animation-delay:.6s}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.who{font-family:var(--mono);font-size:.66rem;letter-spacing:.14em;color:#1E3A2F99;flex:0 0 4.2rem;padding-top:1.15rem;text-align:end}
.bub{flex:1;padding:.9rem 1.25rem;border:1.5px solid var(--ard3);background:#FCF8F0;font-family:var(--disp);font-size:clamp(1.3rem,3.6vw,1.85rem);line-height:1.5}
.bub .rom{font-family:var(--body);font-size:.8rem;color:#1E3A2F99;display:block;margin-top:.2rem;font-style:italic}
.turn.you .bub{border-color:var(--hail);background:var(--hail);color:var(--ard)}
.turn.you .bub .rom{color:#EDE3D199}
.turn.you .who{color:var(--gahwa)}

.btn{display:inline-flex;align-items:center;gap:.5rem;font-family:var(--body);font-weight:600;font-size:.95rem;padding:.7rem 1.3rem;border:2px solid var(--hail);background:var(--hail);color:var(--ard);border-radius:2px;cursor:pointer;transition:.16s}
.btn:hover{background:var(--gahwa);border-color:var(--gahwa)}
.btn.ghost{background:none;color:var(--hail)}
.btn.ghost:hover{background:var(--hail);color:var(--ard)}
.btnrow{display:flex;gap:.7rem;flex-wrap:wrap;margin-top:.4rem}
.quote{border-inline-start:3px solid var(--gahwa);padding-inline-start:1.1rem;margin-top:clamp(2rem,5vw,3rem);font-family:var(--disp);font-size:clamp(1.15rem,2.9vw,1.55rem);line-height:1.7;max-width:52ch}
.quote small{display:block;font-family:var(--body);font-size:.85rem;color:#1E3A2FA6;margin-top:.6rem;line-height:1.6}

.fields{display:grid;grid-template-columns:1fr;gap:1px;background:var(--ard3);border:1px solid var(--ard3);margin-top:clamp(2.4rem,6vw,3.6rem)}
@media(min-width:520px){.fields{grid-template-columns:repeat(2,1fr)}}
@media(min-width:900px){.fields{grid-template-columns:repeat(4,1fr)}}
.fields div{background:var(--ard);padding:1.2rem 1.1rem}
.fields b{display:block;font-family:var(--disp);font-size:1.28rem;margin-bottom:.2rem}
.fields small{font-size:.88rem;color:#1E3A2FC4;line-height:1.65;display:block}

.tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1.6rem}
.tab{font-family:var(--body);font-size:.88rem;background:none;border:1px solid var(--ard3);padding:.45rem .85rem;cursor:pointer;color:inherit;border-radius:2px;transition:.15s}
.tab:hover{border-color:var(--hail)}
.tab[aria-selected="true"]{background:var(--hail);color:var(--ard);border-color:var(--hail)}

.pair{border:1.5px solid var(--hail);background:#FCF8F0;margin-bottom:.9rem}
.pair-when{font-family:var(--mono);font-size:.67rem;letter-spacing:.13em;color:var(--gahwa);padding:.7rem 1.15rem .1rem;text-transform:uppercase}
.pair-row{display:flex;gap:.8rem;align-items:baseline;padding:.35rem 1.15rem}
.pair-row:last-of-type{padding-bottom:.5rem}
.pair-lbl{font-family:var(--mono);font-size:.64rem;letter-spacing:.12em;color:#1E3A2F8C;flex:0 0 4.6rem;text-align:end}
.pair-txt{font-family:var(--disp);font-size:clamp(1.15rem,3.2vw,1.5rem);line-height:1.5}
.pair .r .pair-txt{color:var(--gahwa)}
.pair-rom{padding:0 1.15rem .3rem;font-size:.8rem;color:#1E3A2F99;font-style:italic}
.pair-rom span{color:var(--gahwa);font-weight:600;font-style:normal}
.pair-more{padding:.65rem 1.15rem .9rem;border-top:1px dashed var(--ard3);font-size:.9rem;color:#1E3A2FC4;margin-top:.35rem}
.pair-more b{color:var(--hail);font-weight:600}

.flow{counter-reset:f;list-style:none;padding:0;margin:0;max-width:68ch}
.flow li{counter-increment:f;position:relative;padding-inline-start:3rem;padding-block:.85rem;border-bottom:1px dashed var(--ard3)}
.flow li:last-child{border-bottom:0}
.flow li::before{content:counter(f,decimal-leading-zero);position:absolute;inset-inline-start:0;top:1rem;font-family:var(--mono);font-size:.76rem;color:var(--gahwa)}
.flow strong{font-family:var(--disp);font-size:1.2rem;display:block}
.flow span{color:#1E3A2FCC;font-size:.96rem}

.card{border:1.5px solid var(--hail);background:#FCF8F0;padding:1.2rem 1.3rem;margin-top:1.4rem}
.card h3{font-size:1.3rem;margin-bottom:.4rem}
.card p:last-child{margin-bottom:0}
.dont{list-style:none;padding:0;margin:0}
.dont li{padding:.5rem 0;padding-inline-start:1.4rem;position:relative;font-size:.96rem;border-bottom:1px dashed var(--ard3)}
.dont li:last-child{border-bottom:0}
.dont li::before{content:"\2715";position:absolute;inset-inline-start:0;color:var(--warid);font-size:.8rem;top:.75rem}

.khashm{border:2px solid var(--gahwa);background:#B0742C10;padding:clamp(1.2rem,4vw,2rem);margin-top:clamp(2rem,5vw,2.8rem)}
.khashm h3{font-size:clamp(1.5rem,4vw,2rem);color:var(--gahwa);margin-bottom:.2rem}
.khashm .sub{font-family:var(--mono);font-size:.68rem;letter-spacing:.16em;color:#1E3A2FA6;text-transform:uppercase;margin-bottom:.4rem;display:block}
.kgrid{display:grid;gap:1px;background:var(--ard3);border:1px solid var(--ard3);margin-top:1.2rem;grid-template-columns:1fr}
@media(min-width:680px){.kgrid{grid-template-columns:1fr 1fr}}
.kgrid div{background:#FCF8F0;padding:1rem 1.1rem}
.kgrid b{display:block;font-family:var(--disp);font-size:1.15rem;margin-bottom:.15rem}
.kgrid small{font-size:.9rem;color:#1E3A2FC9;line-height:1.65;display:block}
.mathal{font-family:var(--disp);font-size:clamp(1.3rem,3.6vw,1.8rem);border-inline-start:3px solid var(--gahwa);padding-inline-start:1rem;margin:1.3rem 0}
.mathal small{display:block;font-family:var(--body);font-size:.88rem;color:#1E3A2FA6;margin-top:.45rem;line-height:1.65}

.tf{border:1.5px solid var(--hail);background:#FCF8F0;padding:1.1rem 1.2rem;margin-bottom:.8rem;max-width:720px}
.tf p{margin:0 0 .6rem;font-weight:500}
.tf .minirow{justify-content:flex-start;margin-top:0}
.tf-out{margin-top:.7rem;font-size:.92rem;display:none;padding-inline-start:.8rem;border-inline-start:3px solid var(--nuhas);color:#1E3A2FCC;line-height:1.7}
.tf-out.on{display:block}

/* clothing */
.gender-tabs{display:flex;gap:.4rem;margin-bottom:1.4rem;flex-wrap:wrap}
.gender-tabs button{flex:1;min-width:120px;font-family:var(--body);font-size:.95rem;font-weight:600;background:none;border:1.5px solid var(--ard3);
  padding:.6rem;cursor:pointer;color:inherit;border-radius:3px;transition:.15s}
.gender-tabs button:hover{border-color:var(--hail)}
.gender-tabs button[aria-selected="true"]{background:var(--hail);color:var(--ard);border-color:var(--hail)}
.garment{border:1.5px solid var(--hail);background:#FCF8F0;margin-bottom:.9rem}
.garment>button{width:100%;text-align:start;background:none;border:0;cursor:pointer;font-family:inherit;color:inherit;
  padding:1.05rem 1.2rem;display:flex;align-items:center;gap:1rem}
.garment>button:hover{background:#1e3a2f0a}
.garment .gi{width:52px;height:52px;flex:0 0 52px;border:1.5px solid var(--hail);border-radius:8px;display:grid;place-items:center;background:var(--ard2)}
.garment .gi svg{width:38px;height:38px}
.garment .gt{flex:1;min-width:0}
.garment .gt strong{font-family:var(--disp);font-size:1.32rem;font-weight:700;display:block;line-height:1.3}
.garment .gt span{font-size:.88rem;color:#1E3A2FB0}
.garment .pm{color:var(--gahwa);font-size:1.4rem;line-height:1;transition:transform .22s}
.garment[data-o="1"] .pm{transform:rotate(45deg)}
.garment-body{display:none;padding:0 1.2rem 1.3rem;border-top:1px dashed var(--ard3)}
.garment[data-o="1"] .garment-body{display:block;padding-top:1rem;animation:fade .25s ease}
.garment-body h4{font-family:var(--mono);font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gahwa);margin:1.2rem 0 .5rem}
.garment-body .illus{float:inline-end;width:120px;height:120px;margin:0 0 .8rem 1rem;margin-inline-start:1rem;margin-inline-end:0}
.step-cards{counter-reset:sc;list-style:none;padding:0;margin:0;clear:both}
.step-cards li{counter-increment:sc;position:relative;padding-inline-start:2.8rem;padding-block:.6rem;font-size:.96rem;color:#1E3A2FD9}
.step-cards li::before{content:counter(sc);position:absolute;inset-inline-start:0;top:.55rem;width:1.9rem;height:1.9rem;
  display:grid;place-items:center;border:1.5px solid var(--gahwa);border-radius:50%;font-family:var(--mono);font-size:.78rem;color:var(--gahwa)}
.diffbox{border:2px solid var(--gahwa);background:#B0742C0F;padding:clamp(1.1rem,3vw,1.6rem);margin:clamp(1.6rem,4vw,2.4rem) 0}
.diffbox h3{color:var(--gahwa);font-size:1.4rem;margin-bottom:.8rem}
.diffgrid{display:grid;gap:1px;background:var(--ard3);border:1px solid var(--ard3);grid-template-columns:1fr}
@media(min-width:640px){.diffgrid{grid-template-columns:repeat(3,1fr)}}
.diffgrid div{background:#FCF8F0;padding:1rem 1.1rem}
.diffgrid b{display:block;font-family:var(--disp);font-size:1.25rem;margin-bottom:.3rem;color:var(--hail)}
.diffgrid small{font-size:.9rem;color:#1E3A2FC9;line-height:1.65;display:block}

.doc-note{border:1px solid var(--ard3);background:var(--ard2);padding:1rem 1.15rem;font-size:.92rem;margin-bottom:1.6rem}

/* illustration figure blocks */
.figblock{border:1.5px solid var(--hail);background:#FCF8F0;padding:1.3rem;text-align:center;margin:clamp(1.6rem,4vw,2.4rem) 0}
.figblock svg{width:100%;max-width:280px;height:auto}
.figblock figcaption{font-size:.9rem;color:#1E3A2FA6;margin-top:.7rem;line-height:1.6}
.figrow{display:grid;gap:1rem;grid-template-columns:1fr;margin:clamp(1.6rem,4vw,2.4rem) 0}
@media(min-width:680px){.figrow{grid-template-columns:1fr 1fr}}
.figrow .figblock{margin:0}

.split{display:grid;gap:clamp(1.5rem,4vw,2.5rem);grid-template-columns:1fr;margin-top:clamp(2rem,5vw,3rem)}
@media(min-width:820px){.split{grid-template-columns:290px 1fr;align-items:start}}
.cupbox{border:1.5px solid var(--hail);background:#FCF8F0;padding:1.3rem;text-align:center}
.cup{position:relative;width:126px;height:106px;margin:0 auto 1rem;border:2.5px solid var(--hail);border-top:0;border-radius:0 0 46% 46%;background:#fff;overflow:hidden}
.fill{position:absolute;inset-inline:0;bottom:0;height:0;background:linear-gradient(180deg,#C98A3C,#8A551F);transition:height .3s cubic-bezier(.3,.9,.4,1)}
.limit{position:absolute;inset-inline:0;bottom:33%;border-top:2px dashed var(--warid)}
.limit span{position:absolute;inset-inline-end:2px;top:-1.3rem;font-family:var(--mono);font-size:.58rem;color:var(--warid)}
.gauge{font-family:var(--mono);font-size:.78rem;color:#1E3A2FA6;margin-bottom:.4rem}
.readout{font-size:.93rem;min-height:4.4em;line-height:1.6}
.readout b{font-family:var(--disp);font-size:1.12rem;display:block;margin-bottom:.1rem}
.good{color:var(--hail)}.bad{color:var(--warid)}
.shake{animation:sh .5s ease}
@keyframes sh{0%,100%{transform:none}25%{transform:rotate(-11deg)}75%{transform:rotate(11deg)}}
.mini{font-family:var(--body);font-size:.88rem;background:none;cursor:pointer;border:1px solid var(--ard3);padding:.45rem .8rem;color:inherit;border-radius:2px;transition:.15s}
.mini:hover{background:var(--hail);color:var(--ard);border-color:var(--hail)}
.mini[aria-pressed="true"]{background:var(--hail);color:var(--ard);border-color:var(--hail)}
.minirow{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center;margin-top:.8rem}
.rules{list-style:none;padding:0;margin:0}
.rules li{padding:.8rem 0;border-bottom:1px dashed var(--ard3);display:flex;gap:.9rem;align-items:baseline}
.rules li:last-child{border:0}
.rules em{font-style:normal;font-family:var(--mono);font-size:.66rem;letter-spacing:.13em;color:var(--gahwa);flex:0 0 6rem;text-transform:uppercase}
.rules b{font-weight:600}

.trainer{border:1.5px solid var(--hail);background:#FCF8F0;padding:clamp(1.3rem,4vw,2.2rem);max-width:700px}
.tq{font-family:var(--mono);font-size:.68rem;letter-spacing:.15em;color:var(--gahwa);text-transform:uppercase}
.tphrase{font-family:var(--disp);font-size:clamp(1.5rem,4.6vw,2.2rem);line-height:1.45;margin:.35rem 0 .2rem}
.trom{font-size:.85rem;color:#1E3A2F99;font-style:italic;margin-bottom:1.1rem}
.opts{display:flex;flex-direction:column;gap:.5rem}
.opt{font-family:var(--disp);font-size:clamp(1.05rem,2.8vw,1.28rem);text-align:start;color:inherit;cursor:pointer;background:var(--ard);border:1px solid var(--ard3);padding:.6rem .9rem;border-radius:2px;transition:.15s}
html[dir="ltr"] .opt{font-family:var(--body);font-size:1.02rem}
.opt:hover:not(:disabled){border-color:var(--hail)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--hail);background:#1E3A2F16;font-weight:700}
.opt.wrong{border-color:var(--warid);background:#8C2F2A14;opacity:.75}
.why{margin-top:1rem;font-size:.93rem;color:#1E3A2FCC;border-inline-start:3px solid var(--nuhas);padding-inline-start:.85rem;display:none;line-height:1.7}
.why.on{display:block}
.bar{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-top:1.3rem;padding-top:1rem;border-top:1px dashed var(--ard3);font-size:.9rem}
.bar b{font-family:var(--mono);color:var(--gahwa)}
.badge{margin-top:1.5rem;padding:1.2rem;border:2px solid var(--nuhas);background:#A98A4B14;text-align:center;display:none}
.badge.on{display:block;animation:fade .4s ease}
.badge b{font-family:var(--disp);font-size:1.5rem;display:block;color:var(--gahwa)}

.sc{border:2px solid var(--hail);background:#FCF8F0;padding:1.3rem 1.25rem;margin-bottom:1rem;max-width:700px}
.sc>p{font-weight:600;font-size:1.04rem;margin-bottom:.9rem}
.sc>p b{font-family:var(--mono);font-size:.7rem;color:var(--gahwa);margin-inline-end:.6rem;letter-spacing:.1em}
.sc .opt{font-family:var(--body);font-size:.97rem}

footer{border-top:2px solid var(--hail);margin-top:2rem}
footer .wrap{padding-block:1.8rem;font-size:.85rem;color:#1E3A2FAB;display:flex;gap:1rem;justify-content:space-between;flex-wrap:wrap}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}html{scroll-behavior:auto}}
</style>
</head>
<body>

<header class="top"><div class="wrap">
  <div class="brand" id="brand">سنع <span>الإمارات</span></div>
  <nav aria-label="nav">
    <button data-go="home" data-t="nav_home" aria-current="page">البداية</button>
    <button data-go="salam" data-t="nav_salam">السلام</button>
    <button data-go="rudud" data-t="nav_rudud">الردود</button>
    <button data-go="dhiyafa" data-t="nav_dhiyafa">الضيافة</button>
    <button data-go="libs" data-t="nav_libs">اللبس</button>
    <button data-go="tamreen" data-t="nav_tamreen">تمرّن</button>
  </nav>

   sub:{em:"الثوب الإماراتي الأبيض وشرّابته",ar:"الثوب الإماراتي الأبيض وشرّابته",en:"The white Emirati robe and its tassel",zh:"埃米拉提白袍及其流苏",fr:"La robe blanche émiratie et son gland",de:"Das weiße emiratische Gewand und seine Quaste",ja:"白いエミラティのローブと房飾り",pt:"A túnica branca emiradense e a sua borla",es:"La túnica blanca emiratí y su borla",ru:"Белое эмиратское одеяние и его кисточка"},
   what:{em:"الكندورة هي الثوب الطويل اللي يلبسه الرياييل بالإمارات، أغلبه أبيض بالصيف عشان يرد الشمس. الإماراتية ما فيها ياقة، وفيها «الطربوش» ولا «الفراشة» — شرّابة طويلة تنزل من الرقبة، ومرات يعطّرونها بالعود.",ar:"الكندورة هي الثوب الطويل الذي يرتديه الرجل الإماراتي، غالباً أبيض في الصيف ليعكس الشمس. الإماراتية بلا ياقة، وفيها «الطربوش» أو «الفراشة» — شرّابة طويلة تنزل من الرقبة وقد تُعطَّر بالعود.",en:"The kandura is the long robe worn by Emirati men, usually white in summer to reflect the sun. The Emirati one is collarless and has the 'tarboosh' (also 'farrāsha') — a long tassel from the neck, sometimes perfumed with oud.",zh:"坎杜拉是埃米拉提男子所穿的长袍，夏季多为白色以反射阳光。埃米拉提款式无领，并带有「塔布什」（又称「farrāsha」）——从领口垂下的长流苏，有时以乌木香熏香。",fr:"La kandura est la longue robe des hommes émiratis, souvent blanche en été pour refléter le soleil. Celle des Émirats est sans col et porte le « tarbouche » (ou « farrāsha ») — un long gland partant du col, parfois parfumé à l'oud.",de:"Die Kandura ist das lange Gewand emiratischer Männer, im Sommer meist weiß, um die Sonne zu reflektieren. Die emiratische ist kragenlos und hat den „Tarbusch“ (auch „farrāsha“) — eine lange Quaste am Hals, mitunter mit Oud parfümiert.",ja:"カンドゥーラはエミラティ男性が着る長衣で、夏は日光を反射するため白が多い。エミラティ式は襟なしで、首元から下がる長い房「タルブーシュ（farrāsha）」があり、時にウードで香りづけされる。",pt:"A kandura é a túnica longa dos homens emiradenses, geralmente branca no verão para refletir o sol. A emiradense não tem gola e traz o 'tarboosh' (ou 'farrāsha') — uma longa borla que desce do pescoço, por vezes perfumada com oud.",es:"La kandura es la túnica larga de los hombres emiratíes, normalmente blanca en verano para reflejar el sol. La emiratí no tiene cuello y lleva el 'tarbush' (o 'farrāsha') — una larga borla del cuello, a veces perfumada con oud.",ru:"Кандура — длинное одеяние эмиратских мужчин, летом обычно белое, чтобы отражать солнце. Эмиратская без воротника и с «тарбушем» (он же «farrāsha») — длинной кисточкой от ворота, иногда надушённой удом."},
   steps:{em:["البس الكندورة من فوق، وخلّها تنزل عدل من الكتوف","ظبّط الأكمام إنها توصل للرسغ","رتّب الطربوش إنه ينزل عدل من النص","تأكد إن الطول يوصل لكعب الريّل تقريباً"],ar:["ارتدِ الكندورة من الأعلى ودعها تنسدل من الكتفين","اضبط الأكمام لتصل إلى الرسغ","رتّب الطربوش لينزل مستقيماً من المنتصف","تأكد أن الطول يصل إلى الكعب تقريباً"],en:["Put the kandura on over the head, let it hang straight from the shoulders","Adjust the sleeves to reach the wrist","Straighten the tarboosh so it hangs down the centre","Check the length reaches roughly the ankle"],zh:["从头上套入坎杜拉，让它自肩部垂直落下","调整袖口至手腕","理顺塔布什，使其从中间垂直下垂","确认长度大致及踝"],fr:["Enfile la kandura par la tête, laisse-la tomber droit des épaules","Ajuste les manches jusqu'au poignet","Redresse le tarbouche pour qu'il pende au centre","Vérifie que la longueur arrive à peu près à la cheville"],de:["Die Kandura über den Kopf ziehen, gerade von den Schultern fallen lassen","Die Ärmel bis zum Handgelenk anpassen","Den Tarbusch mittig gerade richten","Prüfen, dass die Länge etwa den Knöchel erreicht"],ja:["カンドゥーラを頭からかぶり、肩からまっすぐ落とす","袖を手首まで整える","タルブーシュを中央にまっすぐ垂らす","丈がほぼ足首に届くか確認する"],pt:["Vista a kandura pela cabeça, deixando-a cair reta dos ombros","Ajuste as mangas até ao pulso","Endireite o tarboosh para pender ao centro","Verifique que o comprimento chega ao tornozelo"],es:["Ponte la kandura por la cabeza, que caiga recta desde los hombros","Ajusta las mangas hasta la muñeca","Endereza el tarbush para que cuelgue por el centro","Comprueba que el largo llegue casi al tobillo"],ru:["Наденьте кандуру через голову, пусть ровно ниспадает с плеч","Отрегулируйте рукава до запястья","Расправьте тарбуш, чтобы свисал по центру","Проверьте, что длина примерно до щиколотки"]}},

   sub:{em:"العباية الرسمية فوق الكندورة",ar:"العباءة الرسمية فوق الكندورة",en:"The formal cloak over the kandura",zh:"套在坎杜拉外的礼服斗篷",fr:"Le manteau de cérémonie sur la kandura",de:"Der formelle Umhang über der Kandura",ja:"カンドゥーラの上に羽織る正装のマント",pt:"O manto formal sobre a kandura",es:"La capa formal sobre la kandura",ru:"Парадный плащ поверх кандуры"},
   what:{em:"البشت عباية واسعة تتلبس فوق الكندورة بالمناسبات — الأعراس والأعياد وزيارة الكبار. لونه أغلبه بني ولا أسود ولا بيج، ومطرّز بخيط ذهبي عالحواف اسمه «الزري». لبسه يبيّن الوقار والمقام.",ar:"البشت عباءة فضفاضة تُلبس فوق الكندورة في المناسبات الرسمية — الأعراس والأعياد وزيارة الكبار. لونه غالباً بني أو أسود أو بيج، ومطرّز بخيط ذهبي على الحواف يُسمّى «الزري». لبسه دلالة على الوقار والمقام.",en:"The bisht is a flowing cloak worn over the kandura for formal occasions — weddings, Eid, visiting elders. Usually brown, black or beige, trimmed with gold thread ('zari') at the edges. Wearing it signals dignity and status.",zh:"比什特是套在坎杜拉外、于正式场合（婚礼、节日、拜访长者）所穿的宽袍。多为棕、黑或米色，边缘饰以金线（「zari」）。着之以显庄重与身份。",fr:"Le bisht est un manteau ample porté sur la kandura lors des occasions officielles — mariages, Aïd, visite des aînés. Souvent brun, noir ou beige, bordé de fil d'or (« zari »). Le porter marque la dignité et le rang.",de:"Der Bisht ist ein weiter Umhang über der Kandura für formelle Anlässe — Hochzeiten, Eid, Besuche bei Älteren. Meist braun, schwarz oder beige, an den Rändern mit Goldfaden („zari“) besetzt. Ihn zu tragen zeigt Würde und Rang.",ja:"ビシュトはカンドゥーラの上に羽織る、婚礼・イード・年長者訪問など正式な場のゆったりしたマント。多くは茶・黒・ベージュで、縁に金糸「ザリ」の刺繍。着用は威厳と地位を示す。",pt:"O bisht é um manto amplo usado sobre a kandura em ocasiões formais — casamentos, Eid, visita a mais velhos. Geralmente castanho, preto ou bege, com fio dourado ('zari') nas bordas. Usá-lo denota dignidade e estatuto.",es:"El bisht es una capa amplia sobre la kandura para ocasiones formales — bodas, Eid, visita a los mayores. Suele ser marrón, negro o beige, con hilo dorado ('zari') en los bordes. Llevarlo denota dignidad y estatus.",ru:"Бишт — просторный плащ поверх кандуры для торжеств: свадеб, Ид, визитов к старшим. Обычно коричневый, чёрный или бежевый, с золотой нитью («зари») по краям. Его ношение означает достоинство и статус."},
   steps:{em:["البس الكندورة والغترة أول","حط البشت على الكتوف من دون ما تدخّل إيدينك كامل بالأكمام","امسك حوافه وخلّه ينسدل عدل","ظبّط الزري (الخيط الذهبي) إنه يبيّن قدام"],ar:["ارتدِ الكندورة والغترة أولاً","ضع البشت على الكتفين دون إدخال اليدين كاملاً في الأكمام","أمسك حوافه ودعه ينسدل باستقامة","اضبط الزري (الخيط الذهبي) ليظهر في المقدمة"],en:["Wear the kandura and ghutra first","Drape the bisht over the shoulders, arms not fully through the sleeves","Hold the edges and let it hang straight","Position the zari (gold trim) so it shows at the front"],zh:["先穿好坎杜拉与头巾","将比什特披于肩上，手臂不必完全穿入袖中","抓住衣边，使其垂直下垂","调整金线（zari）使其显于前方"],fr:["Mets d'abord la kandura et la ghutra","Drape le bisht sur les épaules, sans enfiler complètement les bras","Tiens les bords et laisse-le tomber droit","Place le zari (bordure dorée) pour qu'il paraisse devant"],de:["Zuerst Kandura und Ghutra tragen","Den Bisht über die Schultern legen, Arme nicht ganz durch die Ärmel","Die Ränder halten und gerade fallen lassen","Den Zari (Goldbesatz) vorne sichtbar richten"],ja:["先にカンドゥーラとグトラを着る","ビシュトを肩に掛け、腕は袖に完全には通さない","縁を持ち、まっすぐ垂らす","ザリ（金の縁取り）が前に見えるよう整える"],pt:["Vista primeiro a kandura e a ghutra","Ponha o bisht sobre os ombros, sem enfiar os braços por completo","Segure as bordas e deixe-o pender reto","Posicione o zari (debrum dourado) para aparecer à frente"],es:["Ponte primero la kandura y la ghutra","Coloca el bisht sobre los hombros, sin meter del todo los brazos","Sujeta los bordes y déjalo caer recto","Coloca el zari (borde dorado) para que se vea al frente"],ru:["Сначала наденьте кандуру и гутру","Накиньте бишт на плечи, не вдевая руки полностью в рукава","Держите края и дайте ему ровно ниспасть","Расположите зари (золотую кайму) так, чтобы она была видна спереди"]}},
  {art:"mihzam", name:{em:"المحزم والبنايد",ar:"المحزم والبنايد",en:"Mihzam & Banayid (belt)",zh:"米赫扎姆腰带与子弹带",fr:"Mihzam et banayid (ceinture)",de:"Mihzam & Banayid (Gürtel)",ja:"ミフザームとバナイド（帯）",pt:"Mihzam e banayid (cinto)",es:"Mihzam y banayid (cinturón)",ru:"Михзам и банайид (пояс)"},
   sub:{em:"الحزام اللي يثبّت الخنجر",ar:"الحزام الذي يثبّت الخنجر",en:"The belt that holds the khanjar",zh:"固定匕首的腰带",fr:"La ceinture qui tient le khanjar",de:"Der Gürtel, der den Khanjar hält",ja:"ハンジャル（短剣）を留める帯",pt:"O cinto que segura o khanjar",es:"El cinturón que sujeta el khanjar",ru:"Пояс, удерживающий ханджар"},
   what:{em:"المحزم حزام عريض يتلف حول الخصر ويثبّتون عليه الخنجر. و«البنايد» صفوف من الأشرطة اللي أول كانت تشيل الطلقات، والحين صارت زينة ورمز للرجولة والهيبة. تشوفها بالمناسبات والعروض التراثية.",ar:"المحزم حزام عريض يُلفّ حول الخصر ويُثبّت عليه الخنجر. أما «البنايد» فهي صفوف من الأشرطة التي كانت تحمل الطلقات قديماً، وصارت اليوم زينة ورمزاً للرجولة والهيبة. تظهر في المناسبات والعروض التراثية.",en:"The mihzam is a broad belt wrapped at the waist that holds the khanjar. The 'banayid' are rows of bands that once carried cartridges and are now ornament — a symbol of manhood and prestige. Seen at events and heritage displays.",zh:"米赫扎姆是缠于腰间、用以固定匕首的宽腰带。「banayid」则是昔日盛放子弹的排带，今为装饰，象征男子气概与威望，多见于庆典与传统表演。",fr:"Le mihzam est une large ceinture nouée à la taille qui tient le khanjar. Les « banayid » sont des rangées de bandes qui portaient jadis des cartouches et sont aujourd'hui un ornement — symbole de virilité et de prestige. On les voit aux fêtes et démonstrations patrimoniales.",de:"Der Mihzam ist ein breiter Gürtel um die Taille, der den Khanjar hält. Die „Banayid“ sind Reihen von Bändern, die einst Patronen trugen und heute Zierde sind — Symbol für Männlichkeit und Ansehen. Zu sehen bei Festen und Traditionsvorführungen.",ja:"ミフザームは腰に巻く幅広の帯で、ハンジャルを留める。「バナイド」はかつて弾を収めた帯の列で、今は装飾となり、男らしさと威信の象徴。祭事や伝統の実演で見られる。",pt:"O mihzam é um cinto largo enrolado na cintura que segura o khanjar. Os 'banayid' são fileiras de faixas que outrora levavam cartuchos e hoje são ornamento — símbolo de virilidade e prestígio. Vistos em eventos e mostras de património.",es:"El mihzam es un cinturón ancho ceñido a la cintura que sujeta el khanjar. Los 'banayid' son hileras de cintas que antaño llevaban cartuchos y hoy son adorno — símbolo de hombría y prestigio. Se ven en eventos y muestras del patrimonio.",ru:"Михзам — широкий пояс на талии, удерживающий ханджар. «Банайид» — ряды лент, некогда носивших патроны, а ныне украшение и символ мужества и почёта. Их можно видеть на праздниках и показах наследия."},
   steps:{em:["لف المحزم حول الخصر فوق الكندورة","ثبّته زين إنه ما يرتخي","علّق الخنجر عليه من جهة اليمين","لو فيه بنايد، رتّب صفوفها إنها تبيّن مرتّبة"],ar:["لفّ المحزم حول الخصر فوق الكندورة","ثبّته جيداً حتى لا يرتخي","علّق الخنجر عليه من الجهة اليمنى","إن وُجدت البنايد، رتّب صفوفها لتبدو منظّمة"],en:["Wrap the mihzam around the waist over the kandura","Fasten it firmly so it doesn't loosen","Hang the khanjar on it on the right side","If there are banayid, arrange the rows neatly"],zh:["将米赫扎姆缠于坎杜拉外的腰间","系牢，使其不松脱","把匕首挂在右侧","若有子弹带，整齐排列各排"],fr:["Enroule le mihzam à la taille par-dessus la kandura","Serre-le bien pour qu'il ne se relâche pas","Accroche le khanjar du côté droit","S'il y a des banayid, aligne les rangées proprement"],de:["Den Mihzam über der Kandura um die Taille wickeln","Fest schließen, damit er nicht lockert","Den Khanjar rechts daran hängen","Falls Banayid vorhanden, die Reihen ordentlich richten"],ja:["ミフザームをカンドゥーラの上から腰に巻く","緩まないようしっかり締める","右側にハンジャルを吊るす","バナイドがあれば列を整然と整える"],pt:["Enrole o mihzam na cintura sobre a kandura","Aperte-o bem para não afrouxar","Pendure o khanjar do lado direito","Se houver banayid, alinhe as fileiras com ordem"],es:["Ciñe el mihzam a la cintura sobre la kandura","Ajústalo bien para que no se afloje","Cuelga el khanjar en el lado derecho","Si hay banayid, ordena las hileras con pulcritud"],ru:["Оберните михзам вокруг талии поверх кандуры","Закрепите крепко, чтобы не ослаб","Повесьте ханджар справа","Если есть банайид, ровно расправьте ряды"]}},
  {art:"khazam", name:{em:"الخزام",ar:"الخزام",en:"Khazam",zh:"赫扎姆头绳",fr:"Khazam",de:"Khazam",ja:"ハザーム",pt:"Khazam",es:"Khazam",ru:"Хазам"},
   sub:{em:"عصابة الراس الموشّحة بالفضة",ar:"عصابة الرأس الموشّحة بالفضة",en:"The silver-laced head cord",zh:"缀银的头绳",fr:"Le cordon de tête orné d'argent",de:"Die silberbesetzte Kopfschnur",ja:"銀を飾った頭紐",pt:"O cordão de cabeça com prata",es:"El cordón de cabeza con plata",ru:"Головной шнур с серебром"},
   what:{em:"الخزام عصابة تتلف حول الراس فوق الغترة، تشبه العقال بس موشّحة بسلاسل فضة. أول كانت تثبّت الغترة وترد الشمس والغبار، والحين تتلبس بالمناسبات والأعراس وزيارة كبار القوم كزينة تراثية.",ar:"الخزام عصابة تُلفّ حول الرأس فوق الغترة، تشبه العقال لكنها موشّحة بسلاسل فضية. كانت قديماً تثبّت الغترة وتقي من الشمس والغبار، واليوم تُلبس في المناسبات والأعراس وزيارة كبار القوم كزينة تراثية.",en:"The khazam is a cord wound around the head over the ghutra, like the agal but laced with silver chains. It once secured the ghutra and shielded from sun and dust; today it's worn at occasions, weddings and visits to elders as heritage adornment.",zh:"赫扎姆是缠于头巾之上的头绳，形似阿格勒，但缀有银链。昔日用以固定头巾、遮蔽阳光与尘土；今作为传统饰物见于庆典、婚礼与拜访长者之时。",fr:"Le khazam est un cordon enroulé autour de la tête sur la ghutra, semblable à l'agal mais orné de chaînettes d'argent. Il fixait jadis la ghutra et protégeait du soleil et de la poussière ; aujourd'hui il se porte aux occasions, mariages et visites aux aînés comme parure patrimoniale.",de:"Der Khazam ist eine über der Ghutra um den Kopf gewundene Schnur, ähnlich dem Agal, aber mit Silberkettchen besetzt. Einst hielt er die Ghutra und schützte vor Sonne und Staub; heute trägt man ihn zu Anlässen, Hochzeiten und Besuchen bei Älteren als Traditionsschmuck.",ja:"ハザームはグトラの上から頭に巻く紐で、アガールに似るが銀鎖で飾られる。かつてはグトラを留め日差しや砂塵を防いだが、今は行事・婚礼・年長者訪問で伝統の装飾として用いる。",pt:"O khazam é um cordão enrolado à cabeça sobre a ghutra, semelhante ao agal mas com correntes de prata. Outrora fixava a ghutra e protegia do sol e do pó; hoje usa-se em ocasiões, casamentos e visitas a mais velhos como adorno de património.",es:"El khazam es un cordón enrollado a la cabeza sobre la ghutra, parecido al agal pero con cadenillas de plata. Antaño fijaba la ghutra y protegía del sol y el polvo; hoy se lleva en ocasiones, bodas y visitas a los mayores como adorno patrimonial.",ru:"Хазам — шнур, обвиваемый вокруг головы поверх гутры, похожий на агаль, но с серебряными цепочками. Прежде он закреплял гутру и защищал от солнца и пыли; ныне его носят на торжествах, свадьбах и визитах к старшим как наследное украшение."},
   steps:{em:["ثبّت الغترة على الراس أول","لف الخزام حولها فوق الراس","خلّ السلاسل الفضية تنسدل على الجنب","ظبّطه إنه متوازن ومرتّب"],ar:["ثبّت الغترة على الرأس أولاً","لفّ الخزام حولها فوق الرأس","دع السلاسل الفضية تنسدل على الجانب","اضبطه ليكون متوازناً مرتّباً"],en:["Secure the ghutra on the head first","Wind the khazam around it over the head","Let the silver chains drape at the side","Balance it evenly and neatly"],zh:["先将头巾固定在头上","把赫扎姆缠绕其上","让银链垂于一侧","调整至平衡整齐"],fr:["Fixe d'abord la ghutra sur la tête","Enroule le khazam par-dessus","Laisse les chaînettes d'argent pendre sur le côté","Équilibre-le proprement"],de:["Zuerst die Ghutra am Kopf befestigen","Den Khazam darüber winden","Die Silberkettchen seitlich fallen lassen","Gleichmäßig und ordentlich richten"],ja:["先にグトラを頭に固定する","その上からハザームを巻く","銀鎖を横に垂らす","均整よく整える"],pt:["Fixe primeiro a ghutra na cabeça","Enrole o khazam por cima","Deixe as correntes de prata pender ao lado","Equilibre-o com ordem"],es:["Fija primero la ghutra en la cabeza","Enrolla el khazam por encima","Deja las cadenillas de plata caer al lado","Equilíbralo con pulcritud"],ru:["Сначала закрепите гутру на голове","Обвейте хазам поверх неё","Пусть серебряные цепочки свисают сбоку","Уравновесьте аккуратно"]}},
  {art:"sidiri", name:{em:"الصديري",ar:"الصديري",en:"Sidiri (vest)",zh:"西迪里马甲",fr:"Sidiri (gilet)",de:"Sidiri (Weste)",ja:"シディーリ（ベスト）",pt:"Sidiri (colete)",es:"Sidiri (chaleco)",ru:"Сидири (жилет)"},
   sub:{em:"الصدرية اللي تتلبس فوق الكندورة",ar:"الصدرية التي تُلبس فوق الكندورة",en:"The waistcoat worn over the kandura",zh:"穿在坎杜拉外的背心",fr:"Le gilet porté sur la kandura",de:"Die Weste über der Kandura",ja:"カンドゥーラの上に着るベスト",pt:"O colete usado sobre a kandura",es:"El chaleco sobre la kandura",ru:"Жилет поверх кандуры"},
   what:{em:"الصديري صدرية قصيرة ما فيها أكمام، تتلبس فوق الكندورة، أغلبها مطرّزة ولا من قماش فخم. تعطي الطلّة شكل أنيق ورسمي شوي، وتشوفها بالمناسبات ومرات باللبس اليومي.",ar:"الصديري صدرية قصيرة بلا أكمام تُلبس فوق الكندورة، غالباً مطرّزة أو من قماش فاخر. تمنح الإطلالة مظهراً أنيقاً ورسمياً بعض الشيء، وتظهر في المناسبات وأحياناً في الإطلالات اليومية.",en:"The sidiri is a short sleeveless waistcoat worn over the kandura, often embroidered or of fine cloth. It lends an elegant, slightly formal look; seen at occasions and sometimes in everyday wear.",zh:"西迪里是无袖短马甲，穿在坎杜拉外，多有刺绣或以华料制成，令装束显得雅致而略正式，见于庆典，有时也用于日常。",fr:"Le sidiri est un gilet court sans manches porté sur la kandura, souvent brodé ou en tissu fin. Il donne une allure élégante et un peu formelle ; on le voit aux occasions et parfois au quotidien.",de:"Das Sidiri ist eine kurze ärmellose Weste über der Kandura, oft bestickt oder aus edlem Stoff. Es verleiht einen eleganten, etwas formellen Look; zu sehen bei Anlässen und manchmal im Alltag.",ja:"シディーリはカンドゥーラの上に着る袖なしの短いベストで、多くは刺繍または上質な布地。上品でやや正式な装いになり、行事や時に日常でも見られる。",pt:"O sidiri é um colete curto sem mangas usado sobre a kandura, muitas vezes bordado ou de tecido fino. Dá um ar elegante e algo formal; visto em ocasiões e por vezes no dia a dia.",es:"El sidiri es un chaleco corto sin mangas sobre la kandura, a menudo bordado o de tela fina. Aporta un aire elegante y algo formal; se ve en ocasiones y a veces a diario.",ru:"Сидири — короткий жилет без рукавов поверх кандуры, часто вышитый или из дорогой ткани. Придаёт изящный, слегка официальный вид; встречается на торжествах и порой в повседневности."},
   steps:{em:["البس الكندورة أول","البس الصديري فوقها من الكتوف","تأكد إنه مفتوح من قدام ومرتّب","نسّق لونه مع البشت لو بتلبسه"],ar:["ارتدِ الكندورة أولاً","ارتدِ الصديري فوقها من الكتفين","تأكد أنه مفتوح من الأمام ومرتّب","نسّق لونه مع البشت إن كنت سترتديه"],en:["Wear the kandura first","Put the sidiri over it from the shoulders","Make sure it sits open at the front and neat","Coordinate its colour with the bisht if worn"],zh:["先穿坎杜拉","从肩部套上西迪里","确保前襟敞开且平整","若穿比什特，使其颜色相配"],fr:["Mets d'abord la kandura","Enfile le sidiri par-dessus, aux épaules","Assure-toi qu'il reste ouvert devant et net","Accorde sa couleur au bisht si tu le portes"],de:["Zuerst die Kandura tragen","Das Sidiri über die Schultern anziehen","Darauf achten, dass es vorne offen und ordentlich sitzt","Die Farbe mit dem Bisht abstimmen, falls getragen"],ja:["先にカンドゥーラを着る","肩からシディーリを重ねる","前開きで整っているか確認する","ビシュトを着るなら色を合わせる"],pt:["Vista primeiro a kandura","Ponha o sidiri por cima, pelos ombros","Verifique que fica aberto à frente e arrumado","Combine a cor com o bisht se o usar"],es:["Ponte primero la kandura","Coloca el sidiri encima desde los hombros","Asegúrate de que quede abierto al frente y pulcro","Coordina su color con el bisht si lo llevas"],ru:["Сначала наденьте кандуру","Наденьте сидири поверх с плеч","Убедитесь, что он открыт спереди и аккуратен","Согласуйте цвет с биштом, если он есть"]}},
  {art:"ghutra", name:{em:"السفرة الحمدانية",ar:"الغترة الحمدانية",en:"Ghutra (Hamdaniya wrap)",zh:"哈姆达尼亚缠法头巾",fr:"Ghutra (drapé Hamdaniya)",de:"Ghutra (Hamdaniya-Wicklung)",ja:"グトラ（ハムダニーヤ巻き）",pt:"Ghutra (dobra Hamdaniya)",es:"Ghutra (estilo Hamdaniya)",ru:"Гутра (укладка «хамдания»)"},
   sub:{em:"طرحة الراس بطريقة الحمدانية",ar:"غطاء الرأس بطريقة الحمدانية",en:"The headcloth, Hamdaniya style",zh:"哈姆达尼亚式头巾缠法",fr:"Le couvre-chef, style Hamdaniya",de:"Das Kopftuch im Hamdaniya-Stil",ja:"ハムダニーヤ式の頭布",pt:"O pano de cabeça, estilo Hamdaniya",es:"El pañuelo de cabeza, estilo Hamdaniya",ru:"Головной платок в стиле «хамдания»"},
   what:{em:"«السفرة» ولا الغترة قماش مربّع يتحط على الراس. «الحمدانية» طريقة لف معروفة بالإمارات: تلف طرف الغترة فوق الراس من دون عقال، وتطلع أنيقة ومرتّبة. بالصيف بيضا، وبالشتا مرات حمرا مربّعة (الشماغ).",ar:"«السفرة» أو الغترة قماش مربّع يوضع على الرأس. «الحمدانية» طريقة لفّ معروفة في الإمارات: يُلفّ طرف الغترة فوق الرأس دون عقال فتبدو أنيقة مرتّبة. في الصيف بيضاء، وفي الشتاء أحياناً حمراء مربّعة (الشماغ).",en:"The 'safra' or ghutra is a square cloth worn on the head. The 'Hamdaniya' is a well-known Emirati wrap: one end is folded up over the head without the agal, giving a neat elegant look. White in summer, sometimes red-checked (shmagh) in winter.",zh:"「Safra」即头巾，是覆于头上的方布。「哈姆达尼亚」是埃米拉提知名缠法：不用阿格勒，将一端折叠盖过头顶，显得整洁优雅。夏为白色，冬时或用红格纹（shmagh）。",fr:"La « safra » ou ghutra est un tissu carré posé sur la tête. La « Hamdaniya » est un drapé émirati connu : un pan est replié sur la tête sans l'agal, pour un rendu net et élégant. Blanche en été, parfois à carreaux rouges (shmagh) en hiver.",de:"Die „Safra“ oder Ghutra ist ein quadratisches Kopftuch. Die „Hamdaniya“ ist eine bekannte emiratische Wicklung: Ein Ende wird ohne Agal über den Kopf geschlagen — für einen adretten, eleganten Look. Weiß im Sommer, im Winter mitunter rot kariert (Shmagh).",ja:"「サフラ」ことグトラは頭に載せる正方形の布。「ハムダニーヤ」はエミラティで有名な巻き方で、アガールを使わず一端を頭上に折り上げ、端正で上品に見せる。夏は白、冬は赤い格子（シュマグ）のことも。",pt:"A 'safra' ou ghutra é um pano quadrado sobre a cabeça. A 'Hamdaniya' é uma dobra emiradense conhecida: uma ponta é dobrada sobre a cabeça sem o agal, dando um ar limpo e elegante. Branca no verão, por vezes aos quadrados vermelhos (shmagh) no inverno.",es:"La 'safra' o ghutra es un paño cuadrado sobre la cabeza. La 'Hamdaniya' es una envoltura emiratí conocida: se dobla un extremo sobre la cabeza sin el agal, dando un aire pulcro y elegante. Blanca en verano, a veces a cuadros rojos (shmagh) en invierno.",ru:"«Сафра», или гутра, — квадратный платок на голове. «Хамдания» — известная эмиратская укладка: один край без агаля закидывают на голову, что даёт опрятный, элегантный вид. Летом белая, зимой иногда в красную клетку (шмаг)."},
   steps:{em:["اطوِ الغترة نص مثلث وحطها على الراس، الطرفين سوا","خلّ خط الطوي شوي فوق الحواجب","شيل الطرف الأيمن ولفّه فوق الراس للجهة الثانية","ثبّته وخلّ الطرف ينزل على الكتف، وظبّط الشكل قدام المراية"],ar:["اطوِ الغترة نصف مثلث وضعها على الرأس بطرفين متساويين","اجعل خط الطي أعلى الحاجبين قليلاً","ارفع الطرف الأيمن ولفّه فوق الرأس إلى الجهة الأخرى","ثبّته ودع الطرف ينسدل على الكتف، واضبط الشكل أمام المرآة"],en:["Fold the ghutra into a half-triangle, place on head with both ends even","Keep the fold line just above the eyebrows","Take the right end and wrap it up over the head to the other side","Secure it, let the end fall on the shoulder, adjust in the mirror"],zh:["将头巾折成半三角，置于头上，两端等长","折线保持在眉毛稍上方","取右端翻绕过头顶至另一侧","固定后让末端垂于肩上，对镜整理"],fr:["Plie la ghutra en demi-triangle, pose-la, les deux pans égaux","Garde le pli juste au-dessus des sourcils","Prends le pan droit et enroule-le sur la tête vers l'autre côté","Fixe-le, laisse le pan tomber sur l'épaule, ajuste au miroir"],de:["Die Ghutra zum Halbdreieck falten, mit gleichen Enden auflegen","Die Faltlinie knapp über den Augenbrauen halten","Das rechte Ende über den Kopf zur anderen Seite schlagen","Fixieren, das Ende auf die Schulter fallen lassen, im Spiegel richten"],ja:["グトラを半三角に折り、両端をそろえて頭に載せる","折り目を眉のやや上に保つ","右端を頭上から反対側へ巻き上げる","留めて端を肩に垂らし、鏡で整える"],pt:["Dobre a ghutra em meio triângulo, coloque com as pontas iguais","Mantenha o vinco logo acima das sobrancelhas","Pegue a ponta direita e enrole-a por cima até ao outro lado","Fixe, deixe a ponta cair no ombro, ajuste ao espelho"],es:["Dobla la ghutra en medio triángulo, colócala con los extremos iguales","Deja el pliegue justo sobre las cejas","Toma el extremo derecho y envuélvelo sobre la cabeza al otro lado","Fíjalo, deja caer el extremo al hombro, ajusta en el espejo"],ru:["Сложите гутру в полутреугольник, наденьте с ровными концами","Держите линию сгиба чуть выше бровей","Правый край перекиньте через голову на другую сторону","Закрепите, спустите край на плечо, поправьте у зеркала"]}},
  {art:"khanjar", name:{em:"الخنجر",ar:"الخنجر",en:"Khanjar (dagger)",zh:"汉贾尔弯刀",fr:"Khanjar (poignard)",de:"Khanjar (Dolch)",ja:"ハンジャル（短剣）",pt:"Khanjar (adaga)",es:"Khanjar (daga)",ru:"Ханджар (кинжал)"},
   sub:{em:"الخنجر المنحني رمز الرجولة",ar:"الخنجر المنحني رمز الرجولة",en:"The curved dagger, symbol of manhood",zh:"象征男子气概的弯刀",fr:"Le poignard courbe, symbole de virilité",de:"Der gebogene Dolch, Symbol der Männlichkeit",ja:"男らしさの象徴たる湾曲短剣",pt:"A adaga curva, símbolo de virilidade",es:"La daga curva, símbolo de hombría",ru:"Изогнутый кинжал — символ мужества"},
   what:{em:"الخنجر سلاح تقليدي منحني يثبّتونه على المحزم حول الخصر. غمده منحني ومنقوش، ومرات من فضة. صار رمز للرجولة والهيبة، وتلقاه مطبوع على عملة العشر دراهم وشعار حكومة الشارقة.",ar:"الخنجر سلاح تقليدي منحني يُثبّت على المحزم حول الخصر. غمده منحنٍ ومزخرف، وأحياناً من الفضة. أصبح رمزاً للرجولة والهيبة، وتجده مطبوعاً على عملة العشر دراهم وشعار حكومة الشارقة.",en:"The khanjar is a traditional curved dagger fixed to the belt at the waist. Its sheath is curved and ornate, sometimes silver. It became a symbol of manhood and prestige — and appears on the ten-dirham coin and the emblem of the Sharjah government.",zh:"汉贾尔是固定于腰带的传统弯刀，刀鞘弯曲华饰，有时为银质。它成为男子气概与威望的象征，并见于十迪拉姆硬币及沙迦政府徽章。",fr:"Le khanjar est un poignard courbe traditionnel fixé à la ceinture. Son fourreau, courbe et ouvragé, est parfois en argent. Devenu symbole de virilité et de prestige, il figure sur la pièce de dix dirhams et l'emblème du gouvernement de Charjah.",de:"Der Khanjar ist ein traditioneller gebogener Dolch am Gürtel. Seine Scheide ist gebogen und verziert, mitunter aus Silber. Er wurde zum Symbol für Männlichkeit und Ansehen — und erscheint auf der Zehn-Dirham-Münze und im Wappen der Regierung von Schardscha.",ja:"ハンジャルは腰帯に留める伝統的な湾曲短剣。鞘は曲線を描き装飾され、時に銀製。男らしさと威信の象徴となり、10ディルハム硬貨やシャルジャ政府の紋章にも描かれる。",pt:"O khanjar é uma adaga curva tradicional fixada ao cinto na cintura. A bainha é curva e ornada, por vezes de prata. Tornou-se símbolo de virilidade e prestígio — e figura na moeda de dez dirhams e no emblema do governo de Sharjah.",es:"El khanjar es una daga curva tradicional sujeta al cinturón. Su vaina es curva y ornada, a veces de plata. Se volvió símbolo de hombría y prestigio — y figura en la moneda de diez dírhams y en el emblema del gobierno de Sharjah.",ru:"Ханджар — традиционный изогнутый кинжал, крепящийся к поясу. Ножны изогнуты и украшены, порой серебряные. Он стал символом мужества и почёта и изображён на монете в десять дирхамов и на гербе правительства Шарджи."},
   steps:{em:["البس المحزم على الخصر أول","ثبّت الخنجر على المحزم من جهة اليمين","خلّ نصله مايل شوي للداخل","تأكد إنه ثابت وما يتحرّك وإنت تمشي"],ar:["ارتدِ المحزم على الخصر أولاً","ثبّت الخنجر على المحزم من الجهة اليمنى","اجعل نصله مائلاً قليلاً للداخل","تأكد أنه ثابت لا يتحرّك أثناء المشي"],en:["Put the mihzam on the waist first","Fix the khanjar to the belt on the right side","Angle its blade slightly inward","Make sure it's steady and doesn't shift as you walk"],zh:["先系好腰间的米赫扎姆","将匕首固定于腰带右侧","使刀身略向内倾","确保行走时稳固不晃"],fr:["Mets d'abord le mihzam à la taille","Fixe le khanjar à la ceinture, côté droit","Incline légèrement la lame vers l'intérieur","Vérifie qu'il tient bien et ne bouge pas à la marche"],de:["Zuerst den Mihzam um die Taille legen","Den Khanjar rechts am Gürtel befestigen","Die Klinge leicht nach innen neigen","Prüfen, dass er fest sitzt und beim Gehen nicht verrutscht"],ja:["先に腰へミフザームを着ける","右側で帯にハンジャルを留める","刃をやや内側に傾ける","歩いてもずれず安定しているか確認する"],pt:["Ponha primeiro o mihzam na cintura","Fixe o khanjar ao cinto do lado direito","Incline ligeiramente a lâmina para dentro","Verifique que fica firme e não se mexe ao andar"],es:["Ponte primero el mihzam en la cintura","Fija el khanjar al cinturón en el lado derecho","Inclina la hoja ligeramente hacia dentro","Asegúrate de que quede firme y no se mueva al caminar"],ru:["Сначала наденьте михзам на талию","Закрепите ханджар на поясе справа","Наклоните клинок слегка внутрь","Убедитесь, что он держится и не смещается при ходьбе"]}},
  {art:"khizrana", name:{em:"الخيزرانة",ar:"الخيزرانة",en:"Khaizarana (cane)",zh:"海兹拉纳手杖",fr:"Khaizarana (canne)",de:"Khaizarana (Stock)",ja:"ハイザラーナ（杖）",pt:"Khaizarana (bengala)",es:"Khaizarana (bastón)",ru:"Хайзарана (трость)"},
   sub:{em:"عصا الوقار اللي يشيلها الكبار",ar:"عصا الوقار التي يحملها الكبار",en:"The cane of dignity carried by elders",zh:"长者所持的威仪之杖",fr:"La canne de dignité portée par les aînés",de:"Der Würdestock der Älteren",ja:"年長者が持つ威厳の杖",pt:"A bengala de dignidade dos mais velhos",es:"El bastón de dignidad de los mayores",ru:"Трость достоинства, что носят старшие"},
   what:{em:"الخيزرانة عصا رفيعة طويلة من نبات الخيزران، يشيلها الرياييل خصوصاً الكبار. مب بس عشان تتّكي عليها — هي رمز للوقار والهيبة والمقام، وجزء من طلّة الكبير بالمجلس والمناسبات.",ar:"الخيزرانة عصا رفيعة طويلة من نبات الخيزران، يحملها الرجال خاصةً الكبار. ليست للاتّكاء فقط — بل رمز للوقار والهيبة والمقام، وجزء من إطلالة الكبير في المجلس والمناسبات.",en:"The khaizarana is a slender long cane of bamboo, carried by men, especially elders. Not just for leaning — it is a symbol of dignity, presence and standing, part of an elder's look in the majlis and at occasions.",zh:"海兹拉纳是竹制的细长手杖，为男子尤其长者所持。不仅为倚靠——更是威仪、气度与身份的象征，是长者在马吉利斯与庆典中风范的一部分。",fr:"La khaizarana est une canne fine et longue en bambou, portée par les hommes, surtout les aînés. Pas seulement pour s'appuyer — c'est un symbole de dignité, de prestance et de rang, partie de l'allure de l'aîné au majlis et aux occasions.",de:"Die Khaizarana ist ein schlanker, langer Bambusstock, getragen von Männern, besonders Älteren. Nicht nur zum Stützen — ein Symbol für Würde, Präsenz und Rang, Teil des Auftretens des Älteren im Majlis und bei Anlässen.",ja:"ハイザラーナは竹製の細長い杖で、男性とりわけ年長者が持つ。支えるためだけでなく、威厳・存在感・地位の象徴であり、マジリスや行事での年長者の装いの一部。",pt:"A khaizarana é uma bengala fina e longa de bambu, usada por homens, sobretudo pelos mais velhos. Não é só para apoio — é símbolo de dignidade, presença e estatuto, parte do porte do ancião no majlis e nas ocasiões.",es:"La khaizarana es un bastón fino y largo de bambú que llevan los hombres, en especial los mayores. No solo para apoyarse — es símbolo de dignidad, presencia y estatus, parte de la presencia del mayor en el majlis y las ocasiones.",ru:"Хайзарана — тонкая длинная бамбуковая трость, которую носят мужчины, особенно старшие. Не только опора — символ достоинства, стати и положения, часть облика старшего в меджлисе и на торжествах."},
   steps:{em:["امسكها باليد اليمنى بالغالب","خلّها بمحاذاة جسمك وإنت واقف ولا ماشي","لا تلوّح فيها ولا تعبث فيها بالمجلس","احملها بهدوء — هي رمز وقار مب لعبة"],ar:["امسكها باليد اليمنى غالباً","اجعلها بمحاذاة جسمك وأنت واقف أو تمشي","لا تلوّح بها ولا تعبث بها في المجلس","احملها بهدوء — فهي رمز وقار لا لعبة"],en:["Hold it usually in the right hand","Keep it aligned with your body while standing or walking","Don't wave or fidget with it in the majlis","Carry it calmly — it's a mark of dignity, not a toy"],zh:["通常以右手持握","站立或行走时使其贴合身侧","在马吉利斯中勿挥舞或摆弄","从容持之——它是威仪之征，非玩物"],fr:["Tiens-la en général de la main droite","Garde-la alignée au corps, debout ou en marchant","Ne l'agite pas et n'y joue pas au majlis","Porte-la avec calme — c'est une marque de dignité, pas un jouet"],de:["Meist in der rechten Hand halten","Beim Stehen oder Gehen am Körper ausgerichtet halten","Im Majlis nicht schwenken oder damit spielen","Ruhig tragen — ein Zeichen der Würde, kein Spielzeug"],ja:["ふつう右手で持つ","立つ・歩く際は体に沿わせる","マジリスで振り回したりいじったりしない","静かに持つ——威厳の印であり玩具ではない"],pt:["Segure-a geralmente com a mão direita","Mantenha-a alinhada ao corpo em pé ou a andar","Não a agite nem a manuseie no majlis","Leve-a com calma — é sinal de dignidade, não um brinquedo"],es:["Sostenla normalmente con la mano derecha","Mantenla alineada al cuerpo de pie o al caminar","No la agites ni juegues con ella en el majlis","Llévala con calma — es señal de dignidad, no un juguete"],ru:["Держите обычно в правой руке","Держите вдоль тела, стоя или при ходьбе","Не размахивайте и не вертите ею в меджлисе","Несите спокойно — это знак достоинства, а не игрушка"]}}

 women:[
  {art:"henna", name:{em:"الحنة",ar:"الحنّاء",en:"Henna",zh:"海娜彩绘",fr:"Henné",de:"Henna",ja:"ヘナ",pt:"Hena",es:"Henna",ru:"Хна"},
   sub:{em:"نقوش الحنة على الإيدين والريّول",ar:"نقوش الحنّاء على اليدين والقدمين",en:"Henna patterns on hands and feet",zh:"手足上的海娜纹样",fr:"Motifs de henné sur les mains et les pieds",de:"Henna-Muster an Händen und Füßen",ja:"手足に施すヘナの模様",pt:"Padrões de hena nas mãos e nos pés",es:"Dibujos de henna en manos y pies",ru:"Узоры хны на руках и ногах"},
   what:{em:"الحنة نقوش تتحط على إيدين ورجول الحرمة من عجينة نبات الحنة، لونها بني محمر. جزء أساسي من زينة العروس والأعياد والمناسبات، وفيها نقوش خليجية معروفة. عادة أول، البنت تتعلّمها من أمها وجدتها.",ar:"الحنّاء نقوش تُوضع على يدي وقدمي المرأة من عجينة نبات الحنّاء، لونها بنيّ محمرّ. جزء أساسي من زينة العروس والأعياد والمناسبات، وفيها نقوش خليجية معروفة. عادة قديمة تتوارثها البنات عن الأمهات والجدّات.",en:"Henna is a reddish-brown paste from the henna plant, applied as patterns on a woman's hands and feet. A core part of bridal, Eid and occasion adornment, with well-known Gulf motifs — an old custom passed from grandmothers and mothers to daughters.",zh:"海娜是取自海娜植物的红棕色膏体，绘于女子手足成纹。它是新娘、节日与庆典妆饰的核心，纹样具海湾特色——为祖母、母亲传予女儿的古老习俗。",fr:"Le henné est une pâte brun-rouge issue de la plante de henné, appliquée en motifs sur les mains et les pieds. Élément clé de la parure de la mariée, de l'Aïd et des occasions, aux motifs du Golfe bien connus — une coutume ancienne transmise des grands-mères et mères aux filles.",de:"Henna ist eine rotbraune Paste aus der Hennapflanze, als Muster auf Hände und Füße aufgetragen. Ein Kernstück des Braut-, Eid- und Anlassschmucks mit bekannten Golf-Motiven — ein alter Brauch, von Großmüttern und Müttern an Töchter weitergegeben.",ja:"ヘナはヘナ植物由来の赤褐色のペーストで、女性の手足に模様として施す。花嫁・イード・行事の装いの要で、湾岸の有名な文様を持つ——祖母や母から娘へ受け継がれる古い習わし。",pt:"A hena é uma pasta castanho-avermelhada da planta de hena, aplicada em padrões nas mãos e nos pés. Parte central do adorno de noiva, do Eid e das ocasiões, com motivos do Golfo bem conhecidos — um costume antigo transmitido de avós e mães para filhas.",es:"La henna es una pasta pardo-rojiza de la planta de henna, aplicada como dibujos en manos y pies. Parte esencial del adorno nupcial, del Eid y las ocasiones, con motivos del Golfo muy conocidos — una costumbre antigua transmitida de abuelas y madres a hijas.",ru:"Хна — красновато-коричневая паста из растения хны, наносимая узорами на руки и ноги. Ключевая часть свадебного, праздничного и торжественного убранства с известными заливскими мотивами — старинный обычай, передаваемый от бабушек и матерей к дочерям."},
   steps:{em:["جهّزي عجينة الحنة وحطيها بقمع رفيع","ارسمي النقوش على الإيد ولا الريّل","خليها تنشف زين قبل لا تمسحينها","كل ما بقت أطول، طلع لونها أغمق وأحلى"],ar:["جهّزي عجينة الحنّاء وضعيها في قمع رفيع","ارسمي النقوش على اليد أو القدم","اتركيها تجفّ جيداً قبل مسحها","كلما بقيت أطول، صار لونها أغمق وأجمل"],en:["Prepare the henna paste and load it into a fine cone","Draw the patterns on the hand or foot","Let it dry well before wiping it off","The longer it stays, the darker and richer the colour"],zh:["调好海娜膏，装入细锥","在手或脚上描绘纹样","彻底干透后再擦去","停留越久，色泽越深越美"],fr:["Prépare la pâte de henné et remplis-en un cône fin","Dessine les motifs sur la main ou le pied","Laisse bien sécher avant d'essuyer","Plus il reste, plus la couleur est foncée et riche"],de:["Die Henna-Paste anrühren und in einen feinen Kegel füllen","Die Muster auf Hand oder Fuß zeichnen","Gut trocknen lassen, bevor man sie abwischt","Je länger sie bleibt, desto dunkler und satter die Farbe"],ja:["ヘナのペーストを用意し細いコーンに詰める","手や足に模様を描く","拭き取る前によく乾かす","長く置くほど色が濃く美しくなる"],pt:["Prepare a pasta de hena e coloque-a num cone fino","Desenhe os padrões na mão ou no pé","Deixe secar bem antes de limpar","Quanto mais tempo ficar, mais escura e rica a cor"],es:["Prepara la pasta de henna y ponla en un cono fino","Dibuja los motivos en la mano o el pie","Déjala secar bien antes de retirarla","Cuanto más tiempo permanezca, más oscuro y rico el color"],ru:["Приготовьте пасту хны и наполните тонкий конус","Нарисуйте узоры на руке или ноге","Дайте хорошо высохнуть перед снятием","Чем дольше держится, тем темнее и насыщеннее цвет"]}},
  {art:"mkhawar", name:{em:"الجلابية",ar:"الجلابية",en:"Jalabiya",zh:"贾拉比亚长裙",fr:"Jalabiya",de:"Dschalabiya",ja:"ジャラビーヤ",pt:"Jalabiya",es:"Yalabiya",ru:"Джалабия"},
   sub:{em:"الفستان الواسع المريح",ar:"الفستان الفضفاض المريح",en:"The loose, comfortable gown",zh:"宽松舒适的长裙",fr:"La robe ample et confortable",de:"Das lockere, bequeme Gewand",ja:"ゆったり快適なガウン",pt:"O vestido solto e confortável",es:"El vestido holgado y cómodo",ru:"Свободное удобное платье"},
   what:{em:"الجلابية فستان واسع طويل ومريح، تلبسه الحرمة بالبيت وبالمناسبات. واسعة وخفيفة وتنفع للحر، وتيي بألوان وتطاريز وايد. تفرق عن المخور إنها أبسط وأوسع وتطريزها أقل بالغالب.",ar:"الجلابية فستان فضفاض طويل ومريح، ترتديه المرأة في البيت وفي المناسبات. واسعة وخفيفة تناسب الجو الحار، وتأتي بألوان وتطاريز متنوّعة. تختلف عن المخور بأنها أبسط وأوسع وأقلّ تطريزاً غالباً.",en:"The jalabiya is a loose, long, comfortable gown worn at home and at occasions. Wide and light, suited to the heat, in varied colours and embroidery. It differs from the mkhawar in being simpler, wider and usually less embroidered.",zh:"贾拉比亚是宽松、修长、舒适的长裙，居家与庆典皆宜。宽大轻盈，适应炎热，色彩与刺绣多样。与「穆哈瓦尔」相比，它更简约、更宽大，通常刺绣较少。",fr:"La jalabiya est une robe ample, longue et confortable, portée à la maison et aux occasions. Large et légère, adaptée à la chaleur, en couleurs et broderies variées. Elle diffère du mkhawar en étant plus simple, plus large et généralement moins brodée.",de:"Die Dschalabiya ist ein lockeres, langes, bequemes Gewand für zu Hause und für Anlässe. Weit und leicht, der Hitze angepasst, in vielfältigen Farben und Stickereien. Sie unterscheidet sich vom Mkhawar durch schlichteren, weiteren Schnitt und meist weniger Stickerei.",ja:"ジャラビーヤはゆったり長く快適なガウンで、家庭でも行事でも着る。広く軽く暑さに適し、色や刺繍も多彩。ムハワルより簡素で広く、刺繍は概して少ない点が異なる。",pt:"A jalabiya é um vestido solto, comprido e confortável, usado em casa e em ocasiões. Larga e leve, adequada ao calor, em cores e bordados variados. Difere do mkhawar por ser mais simples, mais larga e geralmente menos bordada.",es:"La yalabiya es un vestido holgado, largo y cómodo, para casa y ocasiones. Amplia y ligera, apta para el calor, en colores y bordados variados. Se diferencia del mkhawar en ser más sencilla, más amplia y por lo general menos bordada.",ru:"Джалабия — свободное длинное удобное платье для дома и торжеств. Широкое и лёгкое, подходит для жары, в разных цветах и с вышивкой. От мхавара отличается простотой, большей шириной и обычно меньшей вышивкой."},
   steps:{em:["البسي الجلابية من فوق، تنزل عدل","تأكدي إنها واسعة ومريحة من الكتوف","نسّقي لونها مع الشيلة","حطي العطر والدخون قبل المناسبة"],ar:["ارتدي الجلابية من الأعلى لتنسدل باستقامة","تأكدي أنها واسعة ومريحة عند الكتفين","نسّقي لونها مع الشيلة","ضعي العطر والدخون قبل المناسبة"],en:["Put the jalabiya on over the head, falling straight","Make sure it's wide and comfortable at the shoulders","Coordinate its colour with the shayla","Apply perfume and dukhoon before the occasion"],zh:["从头套上贾拉比亚，使其垂直落下","确认肩部宽松舒适","使其颜色与希拉头巾相配","赴会前熏香、喷香水"],fr:["Enfile la jalabiya par la tête, tombant droit","Vérifie qu'elle est large et confortable aux épaules","Accorde sa couleur à la shayla","Mets parfum et dukhoon avant l'occasion"],de:["Die Dschalabiya über den Kopf ziehen, gerade fallend","Sicherstellen, dass sie an den Schultern weit und bequem sitzt","Die Farbe mit der Shayla abstimmen","Vor dem Anlass Parfüm und Dukhoon auftragen"],ja:["ジャラビーヤを頭からかぶり、まっすぐ落とす","肩まわりが広く快適か確かめる","色をシャイラと合わせる","行事の前に香水とドゥフーンをまとう"],pt:["Vista a jalabiya pela cabeça, caindo reta","Verifique que é larga e confortável nos ombros","Combine a cor com a shayla","Aplique perfume e dukhoon antes da ocasião"],es:["Ponte la yalabiya por la cabeza, que caiga recta","Asegúrate de que sea amplia y cómoda en los hombros","Coordina su color con la shayla","Aplica perfume y dukhoon antes de la ocasión"],ru:["Наденьте джалабию через голову, пусть ровно ниспадает","Убедитесь, что она широка и удобна в плечах","Согласуйте цвет с шайлой","Нанесите духи и окурите дхуном перед торжеством"]}},
  {art:"mkhawar", name:{em:"المخور",ar:"المخور",en:"Mkhawar",zh:"穆哈瓦尔绣裙",fr:"Mkhawar",de:"Mkhawar",ja:"ムハワル",pt:"Mkhawar",es:"Mkhawar",ru:"Мхавар"},
   sub:{em:"ثوب الحريم المطرّز الفخم",ar:"ثوب النساء المطرّز الفاخر",en:"The richly embroidered women's gown",zh:"华丽刺绣的女装",fr:"La robe féminine richement brodée",de:"Das reich bestickte Frauengewand",ja:"豪奢な刺繍の女性衣装",pt:"O vestido feminino ricamente bordado",es:"El vestido femenino ricamente bordado",ru:"Богато вышитое женское платье"},
   what:{em:"المخور (ومرات «المخوّر») لبس نسائي إماراتي مطرّز عالصدر والأكمام بخيوط ذهبية وملوّنة، وتحته سروال. يتلبس بالمناسبات والأعراس، والتطريز باليد عليه شغل فن أول. أفخم وتطريزه أكثر من الجلابية.",ar:"المخور (ويُسمّى أحياناً «المخوّر») لباس نسائي إماراتي مطرّز عند الصدر والأكمام بخيوط ذهبية وملوّنة، ويُلبس تحته سروال. يُلبس في المناسبات والأعراس، وتطريزه اليدوي فنّ قديم. أفخم وأكثر تطريزاً من الجلابية.",en:"The mkhawar (also 'mukhawwar') is an Emirati women's gown embroidered at the chest and sleeves with gold and coloured thread, worn over trousers. Worn at occasions and weddings; its hand embroidery is an old craft. Richer and more embroidered than the jalabiya.",zh:"穆哈瓦尔（又作「mukhawwar」）是埃米拉提女装，胸口与袖口以金线及彩线刺绣，内配长裤。用于庆典与婚礼，其手工刺绣为古老技艺。较贾拉比亚更为华丽、刺绣更盛。",fr:"Le mkhawar (ou « mukhawwar ») est une robe féminine émiratie brodée au corsage et aux manches de fils d'or et de couleur, portée sur un pantalon. Portée aux occasions et mariages ; sa broderie à la main est un art ancien. Plus riche et plus brodée que la jalabiya.",de:"Der Mkhawar (auch „mukhawwar“) ist ein emiratisches Frauengewand, an Brust und Ärmeln mit Gold- und Buntfäden bestickt, über einer Hose getragen. Für Anlässe und Hochzeiten; die Handstickerei ist ein altes Handwerk. Prächtiger und stärker bestickt als die Dschalabiya.",ja:"ムハワル（「mukhawwar」とも）は胸と袖に金糸・色糸の刺繍を施したエミラティ女性衣装で、下にズボンを履く。行事や婚礼で着用し、手刺繍は古い技。ジャラビーヤより豪華で刺繍が多い。",pt:"O mkhawar (ou 'mukhawwar') é um vestido feminino emiradense bordado no peito e nas mangas com fio dourado e colorido, usado sobre calças. Usado em ocasiões e casamentos; o seu bordado à mão é um ofício antigo. Mais rico e bordado que a jalabiya.",es:"El mkhawar (o 'mukhawwar') es un vestido femenino emiratí bordado en el pecho y las mangas con hilo dorado y de colores, sobre un pantalón. Se lleva en ocasiones y bodas; su bordado a mano es un arte antiguo. Más lujoso y bordado que la yalabiya.",ru:"Мхавар (он же «mukhawwar») — эмиратское женское платье с вышивкой золотой и цветной нитью на груди и рукавах, надевается поверх шаровар. Носят на торжествах и свадьбах; ручная вышивка — старинное ремесло. Наряднее и более вышит, чем джалабия."},
   steps:{em:["البسي السروال أول","البسي المخور من فوق","رتّبي التطريز عند الصدر إنه يبيّن","نسّقي مع الذهب والعطر للمناسبات"],ar:["ارتدي السروال أولاً","ارتدي المخور من الأعلى","رتّبي التطريز عند الصدر ليظهر","نسّقي مع الذهب والعطر في المناسبات"],en:["Put on the trousers first","Slip the mkhawar over the top","Arrange the chest embroidery so it shows","Pair with gold and perfume for occasions"],zh:["先穿长裤","再套上穆哈瓦尔","整理胸口刺绣使其显露","庆典时搭配黄金与香水"],fr:["Mets d'abord le pantalon","Enfile le mkhawar par-dessus","Dispose la broderie du corsage pour qu'elle paraisse","Assortis or et parfum pour les occasions"],de:["Zuerst die Hose anziehen","Den Mkhawar darüberziehen","Die Bruststickerei sichtbar richten","Zu Anlässen mit Gold und Parfüm kombinieren"],ja:["先にズボンを履く","上からムハワルを着る","胸の刺繍が見えるよう整える","行事では金と香水を合わせる"],pt:["Vista primeiro as calças","Ponha o mkhawar por cima","Ajeite o bordado do peito para aparecer","Combine com ouro e perfume nas ocasiões"],es:["Ponte primero el pantalón","Ponte el mkhawar encima","Coloca el bordado del pecho para que se vea","Combina con oro y perfume en las ocasiones"],ru:["Сначала наденьте шаровары","Наденьте мхавар поверх","Расправьте вышивку на груди, чтобы была видна","Дополните золотом и духами для торжеств"]}},
  {art:"mkhawar", name:{em:"الثوب",ar:"الثوب",en:"Thob (over-gown)",zh:"绍布罩袍",fr:"Thob (surrobe)",de:"Thob (Übergewand)",ja:"サウブ（上着）",pt:"Thob (sobreveste)",es:"Thob (sobrevestido)",ru:"Тоб (верхнее платье)"},
   sub:{em:"الثوب الشفاف اللي يتلبس فوق الكندورة",ar:"الثوب الشفاف الذي يُلبس فوق الكندورة",en:"The sheer over-gown worn atop the kandura",zh:"罩于坎杜拉之上的透纱罩袍",fr:"La surrobe légère portée sur la kandura",de:"Das durchscheinende Übergewand über der Kandura",ja:"カンドゥーラの上に重ねる透けた上着",pt:"A sobreveste transparente usada sobre a kandura",es:"El sobrevestido vaporoso sobre la kandura",ru:"Прозрачное верхнее платье поверх кандуры"},
   what:{em:"الثوب لبس نسائي واسع وشفاف يتلبس فوق الكندورة (كندورة الحريم) عشان تبيّن من تحته. رقبته واسعة ومطرّزة بشريط أحمر وأبيض وخيوط فضة، وأكمامه واسعة ومطرّزة. وبالغالب لون الكندورة والثوب متناسق.",ar:"الثوب لباس نسائي واسع وشفاف يُلبس فوق الكندورة (كندورة النساء) لتظهر من تحته. رقبته واسعة مطرّزة بشريط أحمر وأبيض وخيوط فضية، وأكمامه واسعة مطرّزة. وغالباً يتناسق لون الكندورة والثوب.",en:"The thob is a wide, sheer women's over-gown worn atop the kandura (women's kandura) so it shows beneath. Its wide neck is embroidered with red-and-white trim and silver thread, and its wide sleeves are embroidered too. The kandura and thob colours usually match.",zh:"绍布是宽大透纱的女式罩袍，罩于女式坎杜拉之上，使其内衬透出。领口宽大，饰红白镶边与银线；袖口亦宽且绣。坎杜拉与绍布常同色相配。",fr:"Le thob est une surrobe féminine ample et légère portée sur la kandura (kandura féminine), qui transparaît en dessous. Son large col est brodé d'un galon rouge et blanc et de fils d'argent, ses manches larges sont brodées aussi. Kandura et thob s'accordent souvent en couleur.",de:"Der Thob ist ein weites, durchscheinendes Frauen-Übergewand über der Kandura (Frauen-Kandura), sodass diese durchscheint. Der weite Halsausschnitt ist mit rot-weißem Besatz und Silberfaden bestickt, ebenso die weiten Ärmel. Kandura und Thob sind meist farblich abgestimmt.",ja:"サウブは女性用カンドゥーラの上に重ねる、幅広で透けた上着で、下地が透けて見える。広い襟は赤白の縁飾りと銀糸で刺繍され、広い袖も刺繍される。カンドゥーラとサウブは色を合わせることが多い。",pt:"O thob é uma sobreveste feminina larga e transparente usada sobre a kandura (kandura feminina), deixando-a transparecer. O decote largo é bordado com galão vermelho e branco e fio de prata, e as mangas largas também são bordadas. As cores da kandura e do thob costumam combinar.",es:"El thob es un sobrevestido femenino amplio y vaporoso sobre la kandura (kandura femenina), que se transparenta debajo. Su escote ancho lleva ribete rojo y blanco e hilo plateado, y sus mangas anchas van bordadas. Los colores de la kandura y el thob suelen combinar.",ru:"Тоб — широкое прозрачное женское верхнее платье поверх кандуры (женской кандуры), сквозь которое та просвечивает. Широкий ворот вышит красно-белой каймой и серебряной нитью, широкие рукава тоже вышиты. Цвета кандуры и тоба обычно подобраны в тон."},
   steps:{em:["البسي كندورة النساء أول","البسي الثوب الشفاف فوقها","رتّبي الرقبة والأكمام المطرّزة","خلّي لون الكندورة يبيّن من تحت الثوب"],ar:["ارتدي كندورة النساء أولاً","ارتدي الثوب الشفاف فوقها","رتّبي الرقبة والأكمام المطرّزة","دعي لون الكندورة يظهر من تحت الثوب"],en:["Put on the women's kandura first","Wear the sheer thob over it","Arrange the embroidered neck and sleeves","Let the kandura's colour show through the thob"],zh:["先穿女式坎杜拉","再罩上透纱绍布","整理绣饰的领口与袖口","让坎杜拉之色自绍布透出"],fr:["Mets d'abord la kandura féminine","Porte le thob léger par-dessus","Dispose le col et les manches brodés","Laisse la couleur de la kandura transparaître sous le thob"],de:["Zuerst die Frauen-Kandura anziehen","Den durchscheinenden Thob darüber tragen","Den bestickten Ausschnitt und die Ärmel richten","Die Farbe der Kandura durch den Thob durchscheinen lassen"],ja:["先に女性用カンドゥーラを着る","その上に透けたサウブを重ねる","刺繍の襟と袖を整える","カンドゥーラの色をサウブ越しに見せる"],pt:["Vista primeiro a kandura feminina","Use o thob transparente por cima","Ajeite o decote e as mangas bordadas","Deixe a cor da kandura transparecer sob o thob"],es:["Ponte primero la kandura femenina","Lleva el thob vaporoso encima","Coloca el escote y las mangas bordadas","Deja que el color de la kandura se transparente bajo el thob"],ru:["Сначала наденьте женскую кандуру","Наденьте прозрачный тоб поверх","Расправьте вышитый ворот и рукава","Пусть цвет кандуры просвечивает сквозь тоб"]}},
  {art:"gold", name:{em:"المرتعشة والطاسة والسيتمي",ar:"المرتعشة والطاسة والسيتمي",en:"Murta'isha, Tasa & Sitami (gold)",zh:"穆尔塔伊莎、塔萨与西塔米（黄金）",fr:"Murta'isha, tasa et sitami (or)",de:"Murtaʿischa, Tasa & Sitami (Gold)",ja:"ムルタイシャ・ターサ・シタミ（金）",pt:"Murta'isha, tasa e sitami (ouro)",es:"Murta'isha, tasa y sitami (oro)",ru:"Муртаиша, таса и ситами (золото)"},
   sub:{em:"الذهب التقليدي وقطعه",ar:"الذهب التقليدي وقطعه",en:"Traditional gold and its pieces",zh:"传统黄金及其部件",fr:"L'or traditionnel et ses pièces",de:"Traditionelles Gold und seine Stücke",ja:"伝統的な金とその品々",pt:"O ouro tradicional e as suas peças",es:"El oro tradicional y sus piezas",ru:"Традиционное золото и его части"},
   what:{em:"الذهب التقليدي جزء من زينة الحرمة الإماراتية بالأعراس والأعياد. «المرتعشة» قلادة عريضة تغطي الصدر وتتدلى منها قطع ترتج مع الحركة، و«الطاسة» قطعة تتحط على الراس، و«السيتمي» عقد من العملات ولا الحبات الذهبية. كل قطعة تبيّن مقام صاحبتها وذوقها.",ar:"الذهب التقليدي جزء من زينة المرأة الإماراتية في الأعراس والأعياد. «المرتعشة» قلادة عريضة تغطّي الصدر تتدلّى منها قطع ترتجّ مع الحركة، و«الطاسة» قطعة تُوضع على الرأس، و«السيتمي» عقد من العملات أو الحبّات الذهبية. كل قطعة تعبّر عن مقام صاحبتها وذوقها.",en:"Traditional gold is part of an Emirati woman's adornment at weddings and Eid. The 'murta'isha' is a broad chest collar with pieces that tremble as she moves; the 'tasa' is a domed headpiece; the 'sitami' is a necklace of gold coins or beads. Each piece reflects the wearer's taste and standing.",zh:"传统黄金是埃米拉提女子婚礼与节日妆饰的一部分。「穆尔塔伊莎」是覆胸的宽项饰，缀件随身动而颤；「塔萨」是戴于头顶的圆顶饰件；「西塔米」是金币或金珠串成的项链。每件皆显佩戴者之品味与身份。",fr:"L'or traditionnel fait partie de la parure de la femme émiratie aux mariages et à l'Aïd. La « murta'isha » est un large plastron dont les pendeloques tremblent au mouvement ; la « tasa » est une pièce bombée posée sur la tête ; le « sitami » est un collier de pièces ou de perles d'or. Chaque pièce reflète le goût et le rang de celle qui la porte.",de:"Traditionelles Gold gehört zum Schmuck der emiratischen Frau bei Hochzeiten und Eid. Die „Murtaʿischa“ ist ein breiter Brustkragen mit Teilen, die bei Bewegung zittern; die „Tasa“ ist ein gewölbtes Kopfstück; das „Sitami“ ist eine Kette aus Goldmünzen oder -perlen. Jedes Stück spiegelt Geschmack und Rang der Trägerin.",ja:"伝統的な金は婚礼やイードにおけるエミラティ女性の装いの一部。「ムルタイシャ」は胸を覆う幅広の首飾りで、動くと揺れる飾りが下がる。「ターサ」は頭に載せる椀形の飾り。「シタミ」は金貨や金珠の首飾り。各品が着用者の趣味と地位を映す。",pt:"O ouro tradicional faz parte do adorno da mulher emiradense em casamentos e no Eid. A 'murta'isha' é um peitoral largo com pendentes que tremem ao mover-se; a 'tasa' é uma peça abaulada posta na cabeça; o 'sitami' é um colar de moedas ou contas de ouro. Cada peça reflete o gosto e o estatuto de quem a usa.",es:"El oro tradicional es parte del adorno de la mujer emiratí en bodas y Eid. La 'murta'isha' es un collar ancho que cubre el pecho con piezas que tiemblan al moverse; la 'tasa' es una pieza abombada sobre la cabeza; el 'sitami' es un collar de monedas o cuentas de oro. Cada pieza refleja el gusto y el rango de quien la lleva.",ru:"Традиционное золото — часть убранства эмиратской женщины на свадьбах и Ид. «Муртаиша» — широкое нагрудное ожерелье с подвесками, дрожащими при движении; «таса» — куполообразное украшение на голове; «ситами» — ожерелье из золотых монет или бусин. Каждое изделие отражает вкус и положение владелицы."},
   steps:{em:["حطي الطاسة على الراس أول","البسي المرتعشة إنها تغطي الصدر","زيّني الرقبة بالسيتمي","نسّقي الذهب مع لون المخور ولا الثوب"],ar:["ضعي الطاسة على الرأس أولاً","ارتدي المرتعشة لتغطّي الصدر","زيّني الرقبة بالسيتمي","نسّقي الذهب مع لون المخور أو الثوب"],en:["Place the tasa on the head first","Wear the murta'isha to cover the chest","Adorn the neck with the sitami","Coordinate the gold with the mkhawar or thob colour"],zh:["先将塔萨戴于头顶","佩戴穆尔塔伊莎以覆胸","以西塔米饰颈","使黄金与穆哈瓦尔或绍布之色相配"],fr:["Pose d'abord la tasa sur la tête","Porte la murta'isha pour couvrir le buste","Pare le cou du sitami","Accorde l'or à la couleur du mkhawar ou du thob"],de:["Zuerst die Tasa auf den Kopf setzen","Die Murtaʿischa zur Bedeckung der Brust tragen","Den Hals mit dem Sitami schmücken","Das Gold mit der Farbe von Mkhawar oder Thob abstimmen"],ja:["先にターサを頭に載せる","ムルタイシャを着けて胸を覆う","シタミで首元を飾る","金をムハワルやサウブの色に合わせる"],pt:["Coloque primeiro a tasa na cabeça","Use a murta'isha para cobrir o peito","Enfeite o pescoço com o sitami","Combine o ouro com a cor do mkhawar ou do thob"],es:["Coloca primero la tasa en la cabeza","Lleva la murta'isha para cubrir el pecho","Adorna el cuello con el sitami","Coordina el oro con el color del mkhawar o el thob"],ru:["Сначала наденьте тасу на голову","Наденьте муртаишу, чтобы покрыть грудь","Украсьте шею ситами","Согласуйте золото с цветом мхавара или тоба"]}}
 ]

 home_lede:{em:'السنع هو الأدب وحسن التعامل عند الإماراتيين: طريقة سلامك، وردّك على الناس، وإكرامك للضيف، وحتى اللبس اللي تلبسه. تعال نتعلّمه خطوة خطوة.',ar:'السنع هو الأدب وحسن التعامل عند الإماراتيين: طريقة سلامك، وردّك على الناس، وإكرامك للضيف، وحتى ملبسك. تعلّمه خطوة خطوة.',en:'Sana3 is Emirati etiquette and good conduct: how you greet, how you reply, how you honour a guest, even what you wear. Learn it step by step.',zh:'Sana3 是埃米拉提的礼仪与善处之道：如何问候、如何回应、如何待客，乃至衣着。让我们一步步学习。',fr:'Le Sana3, c\'est le savoir-vivre émirati : comment tu salues, tu réponds, tu honores un invité, et même ce que tu portes. Apprends-le pas à pas.',de:'Sana3 ist emiratische Etikette und gutes Benehmen: wie du grüßt, antwortest, einen Gast ehrst, sogar was du trägst. Lerne es Schritt für Schritt.',ja:'Sana3はエミラティの作法と振る舞い——挨拶の仕方、返答、客のもてなし、さらには装いまで。一歩ずつ学ぼう。',pt:'O Sana3 é a etiqueta e a boa conduta emiradenses: como saúdas, respondes, honras um convidado, e até o que vestes. Aprende passo a passo.',es:'El Sana3 es la etiqueta y el buen trato emiratíes: cómo saludas, respondes, honras a un invitado, y hasta lo que vistes. Apréndelo paso a paso.',ru:'Sana3 — это эмиратский этикет и достойное поведение: как вы приветствуете, отвечаете, чествуете гостя и даже что носите. Изучайте шаг за шагом.'},

 kh_intro:{em:'بالإماراتي يسمونها بعد «الموايهة بالخشوم» — تحية بين الرياييل، الخشم يلمس الخشم. وأهم شي تفهمه إنها مب مجاملة: هي إشارة إنك واحد منهم، ومكانتك عند اللي قدامك محفوظة.',ar:'تُسمّى أيضاً «المُوايهة بالخشوم» — تحية بين الرجال، الأنف يلمس الأنف. وأهم ما تفهمه أنها ليست مجاملة: هي إشارة إلى أنك منهم وأن مكانتك محفوظة.',en:'Also called "mwāyaha bil-khushūm" — a greeting between men, nose touching nose. The key thing: it isn\'t a courtesy, it\'s a sign you\'re one of them and your standing with them is secure.',zh:'又称「mwāyaha bil-khushūm」——男子间以鼻碰鼻的问候。要点在于：它并非客套，而是表明你是自己人、地位稳固的信号。',fr:'Aussi appelé « mwāyaha bil-khushūm » — un salut entre hommes, nez contre nez. L\'essentiel : ce n\'est pas une politesse, mais le signe que tu es des leurs et que ton rang est assuré.',de:'Auch „mwāyaha bil-khushūm“ genannt — ein Gruß unter Männern, Nase an Nase. Das Wesentliche: keine Höflichkeit, sondern ein Zeichen, dass du einer von ihnen bist und dein Ansehen gesichert ist.',ja:'「mwāyaha bil-khushūm」とも呼ぶ——男性同士、鼻を触れ合う挨拶。要点は、社交辞令ではなく、あなたが仲間であり地位が確かである証だということ。',pt:'Também chamado "mwāyaha bil-khushūm" — uma saudação entre homens, nariz com nariz. O essencial: não é cortesia, é sinal de que és dos deles e o teu lugar está garantido.',es:'También "mwāyaha bil-khushūm" — un saludo entre hombres, nariz con nariz. Lo clave: no es cortesía, es señal de que eres de los suyos y tu lugar está asegurado.',ru:'Также «mwāyaha bil-khushūm» — приветствие между мужчинами, нос к носу. Главное: это не любезность, а знак, что вы свой и ваше положение прочно.'},
 kh_mathal:{em:'«اربيعك خشمك»',ar:'«رِبعك خشمك»',en:'"Your friend is your nose"',zh:'「挚友如你的鼻子」',fr:'« Ton ami est ton nez »',de:'„Dein Freund ist deine Nase“',ja:'「友は汝の鼻」',pt:'"O teu amigo é o teu nariz"',es:'"Tu amigo es tu nariz"',ru:'«Твой друг — твой нос»'},
 kh_mathal_s:{em:'مثل إماراتي — ربيعك مثل خشمك، ما تقدر تقطعه لأنه عضو النَّفَس ومصدر حياتك. والخشم عند العربي مكان العزة والأنفة، وعشان چذي التحية فيه بالذات.',ar:'مثل إماراتي — صديقك كأنفك لا تستطيع قطعه لأنه عضو التنفّس ومصدر حياتك. والأنف عند العربي موطن العزّة والأنفة، ولذلك كانت التحية به.',en:'An Emirati proverb — a friend is like your nose: you can\'t cut it off, it\'s the organ of breath and life. For Arabs the nose is the seat of pride and honour — hence the greeting is made with it.',zh:'埃米拉提谚语——挚友如鼻，不可断之，因它是呼吸与生命之所系。于阿拉伯人，鼻乃尊严与傲骨之所在，故以之行礼。',fr:'Un proverbe émirati — l\'ami est comme ton nez : tu ne peux le couper, c\'est l\'organe du souffle et de la vie. Chez les Arabes, le nez est le siège de la fierté et de l\'honneur — d\'où ce salut.',de:'Ein emiratisches Sprichwort — ein Freund ist wie deine Nase: du kannst sie nicht abschneiden, sie ist das Organ des Atems und des Lebens. Bei den Arabern ist die Nase Sitz von Stolz und Ehre — daher der Gruß mit ihr.',ja:'エミラティの諺——友は鼻のごとし。呼吸と命の器ゆえ切り離せない。アラブでは鼻は誇りと矜持の座——ゆえに鼻で挨拶する。',pt:'Um provérbio emiradense — o amigo é como o teu nariz: não o podes cortar, é o órgão do fôlego e da vida. Para os árabes o nariz é a sede do orgulho e da honra — daí a saudação com ele.',es:'Un refrán emiratí — un amigo es como tu nariz: no puedes cortarla, es el órgano del aliento y la vida. Para los árabes la nariz es sede del orgullo y el honor — de ahí el saludo.',ru:'Эмиратская пословица — друг как нос: его не отрезать, это орган дыхания и жизни. У арабов нос — средоточие гордости и чести, оттого и приветствие им.'},

 dh_lede:{em:'أول شي يتقدّم للضيف: تمر وقهوة. مب لأنه أكل، بس لأنه رسالة — «إنت مرحّب فيك».',ar:'أول ما يُقدَّم للضيف: تمر وقهوة، ليس لأنه طعام بل لأنه رسالة: «أنت مرحَّبٌ بك».',en:'The first thing offered to a guest: dates and coffee. Not because it\'s food, but because it\'s a message — "you are welcome".',zh:'待客先奉椰枣与咖啡。并非因其为食，而是一则讯息——「欢迎你」。',fr:'La première chose offerte à un invité : dattes et café. Non parce que c\'est de la nourriture, mais parce que c\'est un message — « sois le bienvenu ».',de:'Das Erste, was man einem Gast reicht: Datteln und Kaffee. Nicht weil es Speise ist, sondern weil es eine Botschaft ist — „sei willkommen“.',ja:'客にまず出すのはナツメヤシとコーヒー。食べ物だからではなく、「ようこそ」という便りだから。',pt:'A primeira coisa oferecida a um convidado: tâmaras e café. Não por ser comida, mas por ser uma mensagem — "és bem-vindo".',es:'Lo primero que se ofrece a un invitado: dátiles y café. No por ser comida, sino por ser un mensaje — "eres bienvenido".',ru:'Первое, что подают гостю: финики и кофе. Не потому что это еда, а потому что это послание — «добро пожаловать».'},
