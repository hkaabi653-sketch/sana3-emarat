 dh_fawala_h:{em:'الفوالة',ar:'الفوالة',en:'Al-Fawāla',zh:'Al-Fawāla（茶点）',fr:'Al-Fawāla',de:'Al-Fawāla',ja:'アル・ファワーラ',pt:'Al-Fawāla',es:'Al-Fawāla',ru:'Аль-Фавала'},
 dh_fawala_p:{em:'الفوالة هي اللي يتقدّم قبل الأكل الرئيسي — فواكه وقهوة ومرات طبق شعبي. ويوم تقدّمها تقول للضيف: «اهبش، تفضّل، اقرب». والضيف يرد على «تفضّل» بـ«يديم فضلك».',ar:'الفوالة ما يُقدَّم قبل الطعام الرئيسي — فواكه وقهوة وأحياناً طبق شعبي. وعند تقديمها تقول: «تفضّل، اقرب»، ويردّ الضيف «يديم فضلك».',en:'Al-fawāla is what\'s served before the main meal — fruit, coffee, sometimes a local dish. As you offer it you say "tfaḍḍal, igrab" (please, come closer); the guest replies "ydīm faḍlak".',zh:'Al-fawāla 是正餐前所奉——果品、咖啡，有时还有地方小食。奉上时你说「tfaḍḍal, igrab」（请，靠近些）；客人回「ydīm faḍlak」。',fr:'Al-fawāla est ce qu\'on sert avant le repas — fruits, café, parfois un plat local. En l\'offrant tu dis « tfaḍḍal, igrab » (je t\'en prie, approche) ; l\'invité répond « ydīm faḍlak ».',de:'Al-fawāla ist, was vor dem Hauptmahl gereicht wird — Obst, Kaffee, manchmal ein lokales Gericht. Beim Anbieten sagst du „tfaḍḍal, igrab“ (bitte, komm näher); der Gast antwortet „ydīm faḍlak“.',ja:'アル・ファワーラは主食前に出すもの——果物、コーヒー、時に郷土料理。差し出す際「tfaḍḍal, igrab」（どうぞ、近くへ）と言い、客は「ydīm faḍlak」と返す。',pt:'Al-fawāla é o que se serve antes da refeição — fruta, café, às vezes um prato local. Ao oferecer dizes "tfaḍḍal, igrab" (por favor, aproxima-te); o convidado responde "ydīm faḍlak".',es:'Al-fawāla es lo que se sirve antes de la comida — fruta, café, a veces un plato local. Al ofrecerlo dices "tfaḍḍal, igrab" (por favor, acércate); el invitado responde "ydīm faḍlak".',ru:'Аль-фавала — то, что подают до основной трапезы: фрукты, кофе, иногда местное блюдо. Предлагая, говорят «tfaḍḍal, igrab» (прошу, подойди); гость отвечает «ydīm faḍlak».'},
 dh_dates_h:{em:'ليش التمر بالذات؟',ar:'لماذا التمر تحديداً؟',en:'Why dates specifically?',zh:'为何偏偏是椰枣？',fr:'Pourquoi les dattes en particulier ?',de:'Warum gerade Datteln?',ja:'なぜナツメヤシなのか？',pt:'Porquê tâmaras em especial?',es:'¿Por qué dátiles?',ru:'Почему именно финики?'},
 dh_dates_p:{em:'النخلة كانت أساس العيش، والتمر موجود طول السنة وما يخرب. صار رمز الكرم: تقدّمه لأي ضيف بأي وقت من دون تجهيز ولا طبخ. ومعاه القهوة المرّة، والثنتين يكمّلون بعض.',ar:'كانت النخلة أساس العيش، والتمر متوفّر طوال العام ولا يفسد، فصار رمز الكرم: تقدّمه لأي ضيف في أي وقت دون تجهيز. ومعه القهوة المُرّة، وكلٌّ يكمّل الآخر.',en:'The palm was the basis of life; dates last all year and don\'t spoil. So they became the symbol of generosity — offered to any guest anytime, no cooking needed. Paired with bitter coffee, each completes the other.',zh:'椰枣树曾是生计之本；椰枣四时不缺、久存不坏，遂成慷慨之征——随时可奉任何宾客，无需烹制。佐以苦咖啡，二者相得益彰。',fr:'Le palmier était la base de la vie ; les dattes se gardent toute l\'année sans s\'abîmer. Elles sont devenues le symbole de la générosité — offertes à tout invité, sans cuisine. Avec le café amer, chacun complète l\'autre.',de:'Die Palme war die Lebensgrundlage; Datteln halten das ganze Jahr und verderben nicht. So wurden sie zum Symbol der Großzügigkeit — jedem Gast jederzeit gereicht, ohne Kochen. Mit dem bitteren Kaffee ergänzt eins das andere.',ja:'ナツメヤシの木は暮らしの礎で、実は一年中もち傷まない。ゆえに寛大の象徴となり、調理なしでいつでも客に出せる。苦いコーヒーと合わさり、互いを引き立てる。',pt:'A palmeira era a base da vida; as tâmaras duram o ano todo e não estragam. Tornaram-se símbolo de generosidade — oferecidas a qualquer convidado a qualquer hora, sem cozinhar. Com o café amargo, completam-se.',es:'La palmera era la base de la vida; los dátiles duran todo el año y no se estropean. Por eso son símbolo de generosidad — para cualquier invitado, sin cocinar. Con el café amargo, se complementan.',ru:'Пальма была основой жизни; финики хранятся весь год и не портятся. Так они стали символом щедрости — их подают любому гостю в любое время без готовки. С горьким кофе они дополняют друг друга.'},

 libs_lede:{em:'اللبس جزء من السنع — يبيّن احترامك للمكان وللناس. اختر رياييل ولا حريم، واضغط على أي قطعة عشان تعرف شنو هي وكيف تتلبس خطوة خطوة.',ar:'اللباس جزء من السنع، يُظهر احترامك للمكان والناس. اختر رجال أو نساء، واضغط على أي قطعة لتعرف ما هي وكيف تُلبس خطوة بخطوة.',en:'Dress is part of sana3 — it shows respect for the place and the people. Choose men or women, and tap any item to learn what it is and how it\'s worn, step by step.',zh:'服饰是 sana3 的一部分——彰显你对场合与他人的敬重。选择男装或女装，点按任一件，逐步了解其名与穿法。',fr:'L\'habit fait partie du sana3 — il marque le respect du lieu et des gens. Choisis hommes ou femmes, et touche une pièce pour savoir ce qu\'elle est et comment la porter, pas à pas.',de:'Kleidung gehört zum Sana3 — sie zeigt Respekt für Ort und Leute. Wähle Männer oder Frauen und tippe ein Stück an, um zu erfahren, was es ist und wie man es Schritt für Schritt trägt.',ja:'装いはSana3の一部——場と人への敬意を示す。男性か女性を選び、各品をタップして、それが何で、どう着るかを一歩ずつ学ぼう。',pt:'O traje faz parte do sana3 — mostra respeito pelo lugar e pelas pessoas. Escolhe homens ou mulheres e toca numa peça para saber o que é e como se usa, passo a passo.',es:'La vestimenta es parte del sana3 — muestra respeto por el lugar y la gente. Elige hombres o mujeres y toca cualquier prenda para saber qué es y cómo se lleva, paso a paso.',ru:'Одежда — часть sana3, знак уважения к месту и людям. Выберите мужское или женское и нажмите на предмет, чтобы узнать, что это и как носить, шаг за шагом.'},

  d:{em:'لو دخل أحد أكبر منك ولا صاحب مقام، قوم له. تسلّم وإنت قاعد ينحسب تقصير لو كنت تقدر توقف.',ar:'إذا دخل من هو أكبر منك أو صاحب مقام فقُم له؛ فالجلوس وأنت تسلّم تقصير إن كنت تستطيع القيام.',en:'If an elder or dignitary enters, stand. Greeting while seated is a shortfall if you could rise.',zh:'若长者或尊者进门，应起身。若能起身却坐着问候，即为失礼。',fr:'Si un aîné ou un notable entre, lève-toi. Saluer assis est un manquement si tu pouvais te lever.',de:'Tritt ein Älterer oder Würdenträger ein, steh auf. Sitzend zu grüßen ist ein Versäumnis, wenn du aufstehen könntest.',ja:'年長者や要人が入ったら立つ。立てるのに座ったまま挨拶するのは不足。',pt:'Se entrar um mais velho ou dignitário, levanta-te. Saudar sentado é falta se pudesses erguer-te.',es:'Si entra un mayor o dignatario, levántate. Saludar sentado es una falta si podías levantarte.',ru:'Если входит старший или знатный, встаньте. Приветствовать сидя — упущение, если могли встать.'}},

 {b:{em:'مع الكبير',ar:'مع الكبير',en:'With an elder',zh:'与长者',fr:'Avec un aîné',de:'Mit einem Älteren',ja:'年長者と',pt:'Com um mais velho',es:'Con un mayor',ru:'Со старшим'},

 {q:{em:'لو واحد قال لي «هات خشمك» وأنا مرشوح، أعتذر وأمد يدي.',ar:'إذا قال لي أحد «هات خشمك» وأنا مزكوم، أعتذر وأمدّ يدي.',en:'If someone says "give your nose" and I have a cold, I apologise and offer my hand.',zh:'若有人说「把鼻子给我」而我感冒了，我致歉并伸手。',fr:'Si on me dit « donne ton nez » et que je suis enrhumé, je m\'excuse et tends la main.',de:'Sagt jemand „gib deine Nase“ und ich bin erkältet, entschuldige ich mich und reiche die Hand.',ja:'「鼻を寄こせ」と言われ風邪のとき、詫びて手を差し出す。',pt:'Se alguém disser "dá o teu nariz" e eu estiver constipado, peço desculpa e estendo a mão.',es:'Si alguien dice "dame tu nariz" y estoy resfriado, me disculpo y doy la mano.',ru:'Если говорят «дай нос», а я простужен, я извиняюсь и подаю руку.'},a:true,

function tr(x){ return (x && (x[LANG]!==undefined))?x[LANG]:(x?x.em:''); }
function isLatin(){ return LATIN.indexOf(LANG)>-1; }

const pages=[...document.querySelectorAll('.page')];
function go(id){
  pages.forEach(p=>p.classList.toggle('on',p.id===id));
  document.querySelectorAll('nav button').forEach(b=>b.dataset.go===id?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'));
  history.replaceState(null,'','#'+id);window.scrollTo({top:0,behavior:'instant'});
}
document.addEventListener('click',e=>{const t=e.target.closest('[data-go]');if(t)go(t.dataset.go)});

/* coffee cup */
(function(){
  const fill=document.getElementById('fill'),pct=document.getElementById('pct'),read=document.getElementById('read'),cup=document.getElementById('cup');
  let v=0,done=false;
  window._cupShow=function(){
    fill.style.height=v+'%';pct.textContent=Math.round(v);
    let st,cls;
    if(v===0){st=CUP_READ.empty;cls='';}
    else if(v<=16){st=CUP_READ.low;cls='bad';}        // ~11% too low
    else if(v<=28){st=CUP_READ.almost;cls='good';}     // ~22% almost perfect
    else if(v<=38){st=CUP_READ.good;cls='good';}       // ~33% perfect — صبّة الحشمة
    else if(v<=50){st=CUP_READ.over;cls='bad';}
    else{st=CUP_READ.bad;cls='bad';}
    read.className='readout '+cls;
    read.innerHTML='<b>'+tr(st.t)+'</b><span>'+tr(st.d)+'</span>';
  };
  document.getElementById('pour').onclick=()=>{if(!done){v=Math.min(100,v+11);_cupShow()}};
  document.getElementById('reset').onclick=()=>{v=0;done=false;_cupShow()};
  document.getElementById('hazz').onclick=()=>{
    if(v===0){read.className='readout bad';read.innerHTML='<b>'+tr(CUP_READ.shakeEmpty.t)+'</b><span>'+tr(CUP_READ.shakeEmpty.d)+'</span>';return}
    done=true;cup.classList.remove('shake');void cup.offsetWidth;cup.classList.add('shake');
    read.className='readout good';read.innerHTML='<b>'+tr(CUP_READ.ghanamt.t)+'</b><span>'+tr(CUP_READ.ghanamt.d)+'</span>';
  };
})();

  to.onclick=e=>{
    const b=e.target.closest('.opt');if(!b||qans)return;qans=true;
    to.querySelectorAll('.opt').forEach(o=>{o.disabled=true;if(+o.dataset.o===QUIZ[qi].a)o.classList.add('right');else if(o===b)o.classList.add('wrong')});
    if(+b.dataset.o===QUIZ[qi].a)document.getElementById('tsc').textContent=++qscore;
    tw.innerHTML=tr(QUIZ[qi].w);tw.className='why on';tn.style.visibility='visible';
    tn.textContent=qi<QUIZ.length-1?tr(T.tm_next):tr(T.tm_result);
  };
  tn.onclick=()=>{
    if(qi<QUIZ.length-1){qi++;renderTrainer(false);return}
    to.innerHTML='';tw.className='why';tn.style.visibility='hidden';tq.textContent=tr(T.tm_done);tp.textContent='';tromEl.textContent='';
    const g=qscore>=8?['🏆',T.badge_gold_t,T.badge_gold_d]:qscore>=5?['🥈',T.badge_silver_t,T.badge_silver_d]:['🥉',T.badge_bronze_t,T.badge_bronze_d];
    tb.className='badge on';
    tb.innerHTML=`<span style="font-size:2rem">${g[0]}</span><b>${tr(g[1])}</b><span>${tr(g[2])} — ${tr(T.badge_score)} ${qscore}/${QUIZ.length}.</span>
      <div class="minirow"><button class="mini" id="tagain">${tr(T.tm_again)}</button></div>`;
    document.getElementById('tagain').onclick=()=>renderTrainer(true);
  };
}
function renderScenarios(){
  const box=document.getElementById('sclist');
  box.innerHTML=SC.map((s,i)=>`<div class="sc" data-i="${i}">
    <p><b>${String(i+1).padStart(2,'0')}</b>${tr(s.q)}</p>
    <div class="opts">${tr(s.o).map((o,j)=>`<button class="opt" data-o="${j}">${o}</button>`).join('')}</div>
    <div class="why">${tr(s.w)}</div></div>`).join('');
  box.onclick=e=>{
    const b=e.target.closest('.opt');if(!b||b.disabled)return;
    const card=b.closest('.sc'),s=SC[+card.dataset.i];
    card.querySelectorAll('.opt').forEach(o=>{o.disabled=true;if(+o.dataset.o===s.a)o.classList.add('right');else if(o===b)o.classList.add('wrong')});
    card.querySelector('.why').classList.add('on');
  };
}
function renderAll(){
  applyStrings();renderFields();renderDemo();renderRudud();renderSalam();renderTF();
  renderDhiyafa();renderZi();renderScenarios();renderTrainer(true);window._cupShow();
}

/* language switcher */
function buildLangMenu(){
  const menu=document.getElementById('langmenu');
  menu.innerHTML=Object.keys(LANGS).map(k=>{const L=LANGS[k];
    return `<button data-l="${k}" aria-current="${k===LANG}"><span class="flag">${L.flag}</span> ${L.label}${L.sub?`<span class="sub">${L.sub}</span>`:''}</button>`;
  }).join('');
}
function setLang(k){
  LANG=k;const L=LANGS[k];
  document.documentElement.dir=L.dir;document.documentElement.lang=L.htmllang;
  document.getElementById('langlabel').textContent=L.label;
  buildLangMenu();renderAll();
}
document.getElementById('langbtn').onclick=e=>{
  e.stopPropagation();const m=document.getElementById('langmenu'),btn=document.getElementById('langbtn');
  const open=m.classList.toggle('on');btn.setAttribute('aria-expanded',String(open));
};
document.getElementById('langmenu').onclick=e=>{
  const b=e.target.closest('[data-l]');if(!b)return;
  setLang(b.dataset.l);document.getElementById('langmenu').classList.remove('on');document.getElementById('langbtn').setAttribute('aria-expanded','false');
};
document.addEventListener('click',e=>{if(!e.target.closest('.langwrap')){document.getElementById('langmenu').classList.remove('on');document.getElementById('langbtn').setAttribute('aria-expanded','false');}});

buildLangMenu();renderAll();
if(location.hash&&document.getElementById(location.hash.slice(1)))go(location.hash.slice(1));
</script>
